name: ASTRA supervisor CI

on:
  push:
    branches:
      - "astra-supervisor-*"
    paths:
      - "astra_supervisor/**"
      - "scripts/astra_local_executor.py"
      - "skills/sol-advisor-astra/**"
      - "tests/test_astra_supervisor.py"
      - ".github/workflows/astra-supervisor-ci.yml"
      - "docs/superpowers/specs/2026-09-09-astra-supervisor-multi-executor-design.md"
      - "docs/superpowers/plans/2026-09-09-astra-supervisor-multi-executor.md"
  pull_request:
    branches:
      - main
      - cbi-v6-3-demand-expansion
    paths:
      - "astra_supervisor/**"
      - "scripts/astra_local_executor.py"
      - "skills/sol-advisor-astra/**"
      - "tests/test_astra_supervisor.py"
      - ".github/workflows/astra-supervisor-ci.yml"

permissions:
  contents: read

concurrency:
  group: astra-supervisor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supervisor:
    name: supervisor (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run ASTRA supervisor tests
        run: python -m unittest tests.test_astra_supervisor -v
