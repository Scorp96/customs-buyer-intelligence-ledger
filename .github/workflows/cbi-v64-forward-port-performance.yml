name: CBI v6.4 one-shot performance forward-port

on:
  push:
    branches:
      - cbi-v64-backup-wal-hardening-20260909

permissions:
  contents: write

jobs:
  forward-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install timezone data
        run: python -m pip install --disable-pip-version-check --no-input tzdata==2026.3
      - name: Configure git
        run: |
          git config user.name 'cbi-v64-forward-port'
          git config user.email 'actions@users.noreply.github.com'
      - name: Cherry-pick verified performance protocol
        run: |
          git fetch origin 6e217480781b416fae202837156421ae0adb8e2e
          git cherry-pick -x 6e217480781b416fae202837156421ae0adb8e2e
      - name: Verify GREEN before push
        run: |
          python -m unittest \
            tests.test_v64_state_query_performance_protocol \
            tests.test_v61_load_acceptance \
            tests.test_v64_request_scoped_verified_snapshot -v
          python scripts/run_v6_load_acceptance.py --profile smoke --enforce-targets
      - name: Remove one-shot runner
        run: |
          git rm .github/workflows/cbi-v64-forward-port-performance.yml
          git commit -m 'chore(v64): remove performance forward-port runner'
      - name: Push verified result
        run: git push origin HEAD:cbi-v64-backup-wal-hardening-20260909
