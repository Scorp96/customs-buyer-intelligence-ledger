name: CBI v6.3 exact feature bootstrap

on:
  push:
    branches:
      - cbi-v6-3-demand-expansion

permissions:
  contents: write

concurrency:
  group: cbi-v63-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expand-test-commit:
    if: contains(github.event.head_commit.message, '[v63-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bootstrap feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Harden bootstrap gates, expand exact v6.3 staging, test and commit
        run: |
          run_bootstrap() {
            echo 'STAGE ancestry'
            git merge-base --is-ancestor ba3bffdae13cef186b20b50335c3207fb3390ec6 HEAD || return $?
            echo 'STAGE chunk-gate'
            sed -i 's/if len(chunks) != 16:/if len(chunks) != 32:/' tools/v63_bootstrap_expand.py || return $?
            echo 'STAGE attestation-scope'
            sed -i '/".github\/workflows\/cbi-v63-bootstrap.yml",/a\        "V63_FEATURE_ATTESTATION.json",' tools/v63_bootstrap_expand.py || return $?
            echo 'STAGE base-gate'
            sed -i '/    # Bootstrap commit must be exactly one child of the reviewed production commit\./,+3c\    parent = EXPECTED_BASE' tools/v63_bootstrap_expand.py || return $?
            echo 'STAGE python-bootstrap'
            python -B -Xutf8 tools/v63_bootstrap_expand.py
          }
          set +e
          run_bootstrap > /tmp/v63-bootstrap.txt 2>&1
          rc=$?
          set -e
          cat /tmp/v63-bootstrap.txt
          if [ "$rc" -ne 0 ]; then
            cp /tmp/v63-bootstrap.txt V63_BOOTSTRAP_FAILURE.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f V63_BOOTSTRAP_FAILURE.txt
            git commit -m 'chore(v63): capture bootstrap failure [skip ci]'
            git push origin HEAD:cbi-v6-3-demand-expansion
            exit "$rc"
          fi
