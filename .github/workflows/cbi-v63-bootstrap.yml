name: CBI v6.3 exact feature bootstrap

on:
  push:
    branches:
      - cbi-v6-3-demand-expansion

permissions:
  contents: write

concurrency:
  group: cbi-v63-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expand-test-commit:
    if: contains(github.event.head_commit.message, '[v63-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bootstrap feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Run permanent v6.3 bootstrap
        shell: bash
        run: |
          set +e
          python -B -Xutf8 tools/v63_bootstrap_expand.py > /tmp/v63-bootstrap.txt 2>&1
          rc=$?
          set -e
          cat /tmp/v63-bootstrap.txt

          if [ "$rc" -ne 0 ]; then
            cp /tmp/v63-bootstrap.txt V63_BOOTSTRAP_FAILURE.txt
            git reset
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f V63_BOOTSTRAP_FAILURE.txt
            git commit -m 'chore(v63): capture bootstrap failure [skip ci]'
            git push origin HEAD:cbi-v6-3-demand-expansion
            exit "$rc"
          fi
