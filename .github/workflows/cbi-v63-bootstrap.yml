name: CBI v6.3 exact feature bootstrap

on:
  push:
    branches:
      - cbi-v6-3-demand-expansion

permissions:
  contents: write

concurrency:
  group: cbi-v63-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expand-test-commit:
    if: contains(github.event.head_commit.message, '[v63-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bootstrap feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Harden bootstrap gates, expand exact v6.3 staging, test and commit
        run: |
          run_bootstrap() {
            echo 'STAGE ancestry'
            git merge-base --is-ancestor ba3bffdae13cef186b20b50335c3207fb3390ec6 HEAD || return $?
            echo 'STAGE patch-bootstrap-script'
            python - <<'PY'
          from pathlib import Path
          p = Path('tools/v63_bootstrap_expand.py')
          s = p.read_text(encoding='utf-8')

          if 'if not chunks:' in s:
              s = s.replace('if not chunks:', 'if len(chunks) != 32:', 1)
          elif 'if len(chunks) != 32:' not in s:
              raise SystemExit('EXPECTED_CHUNK_GATE_NOT_FOUND')

          scope_marker = '        ".github/workflows/cbi-v63-bootstrap.yml",\n'
          if '        "V63_FEATURE_ATTESTATION.json",\n' not in s or '        "V63_BOOTSTRAP_FAILURE.txt",\n' not in s:
              if scope_marker not in s:
                  raise SystemExit('EXPECTED_SCOPE_MARKER_NOT_FOUND')
              additions = ''
              if '        "V63_FEATURE_ATTESTATION.json",\n' not in s:
                  additions += '        "V63_FEATURE_ATTESTATION.json",\n'
              if '        "V63_BOOTSTRAP_FAILURE.txt",\n' not in s:
                  additions += '        "V63_BOOTSTRAP_FAILURE.txt",\n'
              s = s.replace(scope_marker, scope_marker + additions, 1)

          base_old = '''    parent = run(["git", "rev-parse", "HEAD^"], cwd=repo, capture=True)\n    if parent.lower() != EXPECTED_BASE:\n        raise RuntimeError(f"V63_BOOTSTRAP_BASE_MISMATCH:{parent}")\n'''
          if base_old in s:
              s = s.replace(base_old, '    parent = EXPECTED_BASE\n', 1)
          elif '    parent = EXPECTED_BASE\n' not in s:
              raise SystemExit('EXPECTED_BASE_GATE_NOT_FOUND')

          p.write_text(s, encoding='utf-8', newline='')
          PY
            patch_rc=$?
            [ "$patch_rc" -eq 0 ] || return "$patch_rc"
            rm -f V63_BOOTSTRAP_FAILURE.txt
            echo 'STAGE python-bootstrap'
            python -B -Xutf8 tools/v63_bootstrap_expand.py
          }
          set +e
          run_bootstrap > /tmp/v63-bootstrap.txt 2>&1
          rc=$?
          set -e
          cat /tmp/v63-bootstrap.txt
          if [ "$rc" -ne 0 ]; then
            cp /tmp/v63-bootstrap.txt V63_BOOTSTRAP_FAILURE.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f V63_BOOTSTRAP_FAILURE.txt
            git commit -m 'chore(v63): capture bootstrap failure [skip ci]'
            git push origin HEAD:cbi-v6-3-demand-expansion
            exit "$rc"
          fi
