name: CBI v6.4 C279 main forwarding fix

on:
  push:
    branches:
      - cbi-v64-release-candidate-c279-diagnostic-a311a2a5

permissions:
  contents: write

concurrency:
  group: cbi-v64-c279-main-forwarding-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cbi-v64-release-candidate-c279-diagnostic-a311a2a5
          fetch-depth: 0

      - name: Apply exact main-to-serve forwarding fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('mcp/chatgpt_oauth_transport.py')
          text = path.read_text(encoding='utf-8')
          old = '''def main(
              dispatch: Callable[[str, dict[str, Any]], Any],
              health: Callable[[], dict[str, Any]] | None = None,
          ) -> int:
              args = base._parser().parse_args()
              return serve(dispatch, health=health, host=args.host, port=args.port)'''
          new = '''def main(
              dispatch: Callable[[str, dict[str, Any]], Any],
              health: Callable[[], dict[str, Any]] | None = None,
              *,
              diagnostic_export: Callable[[], dict[str, Any]] | None = None,
              diagnostic_static_bearer: str = "",
          ) -> int:
              args = base._parser().parse_args()
              return serve(
                  dispatch,
                  health=health,
                  host=args.host,
                  port=args.port,
                  diagnostic_export=diagnostic_export,
                  diagnostic_static_bearer=diagnostic_static_bearer,
              )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one main forwarding anchor, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run focused regressions
        run: >-
          python -m unittest -v
          tests.test_v64_c279_transport_main_forwarding
          tests.test_v64_c279_export_transport
          tests.test_v64_c279_export_entrypoint_contract
          tests.test_v64_c279_single_session_export

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cbi-v64-c279-main-forwarding-fix.yml
          git add mcp/chatgpt_oauth_transport.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v64): forward C279 diagnostics through transport main'
          git push origin HEAD:cbi-v64-release-candidate-c279-diagnostic-a311a2a5
