name: CBI v6.4 production MCP readonly surface probe

on:
  push:
    branches:
      - cbi-v64-production-mcp-readonly-surface-20260910

permissions:
  contents: read

jobs:
  production-mcp-readonly-surface:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_SHA: 58c3120c534d83f7e119701504c38be58ca9e475
      PRODUCTION_URL: https://cbi-v61-preview.onrender.com
    steps:
      - name: Checkout exact candidate helper base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4812e1d0d27ab2c1e69d885db3b0456d94305ac9
          persist-credentials: false

      - name: Verify production branch before read
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')"
          test "$actual" = "$PRODUCTION_SHA"

      - name: Enumerate complete live production MCP tool directory read only
        shell: bash
        env:
          CBI_V63_ACCEPTANCE_BEARER_TOKEN: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cbi-v64-prod-mcp-surface"
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from pathlib import Path

          base = os.environ['PRODUCTION_URL'].rstrip('/')
          expected_sha = os.environ['PRODUCTION_SHA']
          token = str(os.environ.get('CBI_V63_ACCEPTANCE_BEARER_TOKEN') or '')
          if not token:
              raise SystemExit('PRODUCTION_MCP_READ_TOKEN_MISSING')
          with urllib.request.urlopen(base + '/healthz', timeout=90.0) as response:
              health = json.loads(response.read().decode('utf-8'))
          identity = health.get('deployment_identity') if isinstance(health, dict) else None
          if not isinstance(identity, dict) or identity.get('git_sha') != expected_sha:
              raise SystemExit('PRODUCTION_HEALTH_SHA_MISMATCH')

          body = json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/list','params':{}}, separators=(',', ':')).encode()
          request = urllib.request.Request(base + '/mcp', data=body, method='POST', headers={
              'Authorization':'Bearer ' + token,
              'Content-Type':'application/json',
              'Accept':'application/json',
              'MCP-Protocol-Version':'2026-07-28',
          })
          try:
              with urllib.request.urlopen(request, timeout=90.0) as response:
                  payload = json.loads(response.read().decode('utf-8'))
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'PRODUCTION_MCP_HTTP_{exc.code}') from None
          if not isinstance(payload, dict) or payload.get('jsonrpc') != '2.0' or payload.get('id') != 1:
              raise SystemExit('PRODUCTION_MCP_RESPONSE_INVALID')
          if isinstance(payload.get('error'), dict):
              raise SystemExit(f"PRODUCTION_MCP_JSONRPC_ERROR:{payload['error'].get('code')}")
          result = payload.get('result')
          tools = result.get('tools') if isinstance(result, dict) else None
          if not isinstance(tools, list):
              raise SystemExit('PRODUCTION_MCP_TOOLS_LIST_MISSING')
          names = sorted({str(x.get('name') or '').strip() for x in tools if isinstance(x,dict) and str(x.get('name') or '').strip()})
          readish = [n for n in names if any(k in n.casefold() for k in ('get','list','read','find','search','status','health','contract','pending','state','audit','export','snapshot','backup','restore'))]
          receipt = {
              'schema':'cbi.v64-production-mcp-readonly-directory.v1',
              'production_write_performed':False,
              'production_git_sha':expected_sha,
              'tool_count':len(names),
              'all_tool_names':names,
              'read_or_enumeration_candidate_names':readish,
              'read_only_surface_probe':True,
          }
          out=Path(os.environ['RUNNER_TEMP'])/'cbi-v64-prod-mcp-surface'/'CBI_V64_PRODUCTION_MCP_READONLY_DIRECTORY.json'
          out.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Verify production branch after read
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')"
          test "$actual" = "$PRODUCTION_SHA"
          echo "PRODUCTION_BRANCH_UNCHANGED=$actual"

      - name: Upload sanitized surface receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cbi-v64-production-mcp-readonly-directory-${{ github.run_id }}
          path: ${{ runner.temp }}/cbi-v64-prod-mcp-surface/CBI_V64_PRODUCTION_MCP_READONLY_DIRECTORY.json
          if-no-files-found: error
          retention-days: 14
