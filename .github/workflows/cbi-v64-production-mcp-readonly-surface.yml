name: CBI v6.4 production MCP readonly surface probe

on:
  push:
    branches:
      - cbi-v64-production-mcp-readonly-surface-20260910

permissions:
  contents: read

jobs:
  production-mcp-readonly-surface:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_SHA: 58c3120c534d83f7e119701504c38be58ca9e475
      PRODUCTION_URL: https://cbi-v61-preview.onrender.com
    steps:
      - name: Checkout exact candidate helper base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4812e1d0d27ab2c1e69d885db3b0456d94305ac9
          persist-credentials: false

      - name: Verify production branch before read
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')"
          test "$actual" = "$PRODUCTION_SHA"

      - name: Enumerate live production MCP tool names read only
        shell: bash
        env:
          CBI_V63_ACCEPTANCE_BEARER_TOKEN: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cbi-v64-prod-mcp-surface"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from unified_runtime.render_r2_acceptance_client_v63 import (
              RenderR2AcceptanceClient,
              RenderR2AcceptanceClientConfig,
          )

          token = str(os.environ.get('CBI_V63_ACCEPTANCE_BEARER_TOKEN') or '')
          if not token:
              raise SystemExit('PRODUCTION_MCP_READ_TOKEN_MISSING')
          client = RenderR2AcceptanceClient(RenderR2AcceptanceClientConfig(
              base_url=os.environ['PRODUCTION_URL'],
              bearer_token=token,
              expected_git_sha=os.environ['PRODUCTION_SHA'],
              timeout_seconds=90.0,
          ))
          health = client.read_health()
          names = client.list_tool_names()
          keywords = ('export','snapshot','backup','migration','migrate','state','restore')
          relevant = [name for name in names if any(k in name.casefold() for k in keywords)]
          receipt = {
              'schema':'cbi.v64-production-mcp-readonly-surface.v1',
              'production_write_performed':False,
              'production_git_sha':(health.get('deployment_identity') or {}).get('git_sha'),
              'tool_count':len(names),
              'export_snapshot_related_tool_names':relevant,
              'read_only_surface_probe':True,
          }
          out=Path(os.environ['RUNNER_TEMP'])/'cbi-v64-prod-mcp-surface'/'CBI_V64_PRODUCTION_MCP_READONLY_SURFACE.json'
          out.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Verify production branch after read
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')"
          test "$actual" = "$PRODUCTION_SHA"
          echo "PRODUCTION_BRANCH_UNCHANGED=$actual"

      - name: Upload sanitized surface receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cbi-v64-production-mcp-readonly-surface-${{ github.run_id }}
          path: ${{ runner.temp }}/cbi-v64-prod-mcp-surface/CBI_V64_PRODUCTION_MCP_READONLY_SURFACE.json
          if-no-files-found: error
          retention-days: 14
