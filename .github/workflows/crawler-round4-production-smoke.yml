name: CBI crawler round4 production smoke

on:
  push:
    branches:
      - cbi-v64-crawler-bridge-round4
      - "cbi-v64-release-candidate-crawler-round4-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Run round4 crawler and release tests
        run: >-
          python -m unittest
          tests.test_v64_crawler_mcp_surface
          tests.test_v64_public_network_guard
          tests.test_v64_release_identity
          tests.test_v64_production_tool_surface_declaration
          tests.test_v64_crawler_execution_bridge
          tests.test_v64_browser_escalation
          -v

      - name: Run privacy scan
        run: python tests/privacy_scan.py

      - name: Compile round4 crawler integration
        run: >-
          python -m py_compile
          mcp/crawler_tool_v64.py
          mcp/server_v61.py
          mcp/server_v61_remote.py
          unified_runtime/public_network_guard.py
          unified_runtime/crawler_execution_bridge.py
          unified_runtime/browser_escalation.py

      - name: Build crawler-enabled production image
        run: docker build -f deploy/cloud/Dockerfile -t cbi-crawler-round4:${GITHUB_SHA} .

      - name: Verify real Chromium inside production image
        run: >-
          docker run --rm
          --network none
          --entrypoint python
          cbi-crawler-round4:${GITHUB_SHA}
          scripts/run_browser_round2_live_smoke.py

      - name: Verify remote MCP crawler surface and live public crawl
        shell: bash
        run: |
          set -euo pipefail
          image="cbi-crawler-round4:${GITHUB_SHA}"
          name="cbi-crawler-mcp-${GITHUB_RUN_ID}"
          cleanup() {
            docker logs "$name" 2>/dev/null || true
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d             --name "$name"             --read-only             --tmpfs /tmp:size=128m,mode=1777             --cap-drop ALL             --security-opt no-new-privileges:true             -e CBI_REMOTE_AUTH_MODE=none             -e CBI_CRAWLER_ENABLED=1             -e CBI_CRAWLER_MAX_CONCURRENCY=1             -e PORT=8788             -p 127.0.0.1:18787:8788             "$image"

          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:18787"
          last = None
          for _ in range(160):
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=1) as response:
                      health = json.load(response)
                  if health.get("status") == "ok":
                      break
              except Exception as exc:
                  last = exc
              time.sleep(0.25)
          else:
              raise SystemExit(f"round4 crawler MCP health did not become ready: {last}")

          crawler = health.get("crawler_runtime") or {}
          assert crawler.get("enabled") is True, crawler
          assert crawler.get("crawl4ai_present") is True, crawler
          assert crawler.get("playwright_present") is True, crawler
          assert crawler.get("paid_api_required") is False, crawler
          assert crawler.get("public_network_only") is True, crawler
          assert crawler.get("request_interception_guard") is True, crawler
          assert crawler.get("redirect_revalidation") is True, crawler
          assert crawler.get("max_pages_per_call") == 12, crawler
          assert crawler.get("max_concurrency") == 1, crawler

          def post(method, request_id, params, extra_headers=None, timeout=30):
              body = json.dumps({
                  "jsonrpc": "2.0",
                  "id": request_id,
                  "method": method,
                  "params": params,
              }).encode("utf-8")
              headers = {
                  "Content-Type": "application/json",
                  "Accept": "application/json, text/event-stream",
                  "MCP-Protocol-Version": "2026-07-28",
                  "Mcp-Method": method,
              }
              headers.update(extra_headers or {})
              request = urllib.request.Request(base + "/mcp", data=body, headers=headers, method="POST")
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  payload = json.load(response)
              if "error" in payload:
                  raise SystemExit(f"{method} returned error: {payload['error']}")
              return payload["result"]

          tools = post(
              "tools/list",
              "tools-1",
              {"_meta": {
                  "io.modelcontextprotocol/protocolVersion": "2026-07-28",
                  "io.modelcontextprotocol/clientCapabilities": {},
              }},
          )
          rows = {
              row.get("name"): row
              for row in tools.get("tools", [])
              if isinstance(row, dict)
          }
          assert "execute_public_crawl" in rows, sorted(rows)
          descriptor = rows["execute_public_crawl"]
          assert descriptor.get("annotations", {}).get("readOnlyHint") is True, descriptor
          assert descriptor["inputSchema"]["properties"]["max_pages"]["maximum"] == 12, descriptor

          crawl_call = post(
              "tools/call",
              "crawl-1",
              {
                  "name": "execute_public_crawl",
                  "arguments": {
                      "task": {
                          "call_id": "CI-ROUND4-EXAMPLE",
                          "source_family": "official_home",
                          "query": "example public company website",
                      },
                      "seed_url": "https://example.com/",
                      "max_pages": 1,
                      "browser_escalation": False,
                      "timeout_seconds": 20,
                      "max_retries": 1,
                  },
              },
              {"Mcp-Name": "execute_public_crawl"},
              timeout=40,
          )
          structured = crawl_call.get("structuredContent") or {}
          assert structured.get("status") == "CRAWL_EXECUTED", structured
          assert structured.get("pages_crawled", 0) >= 1, structured
          assert structured.get("production_route_ownership_promoted") is False, structured
          assert structured.get("owner_scope") == "UNVERIFIED", structured
          print("Round4 production MCP crawler smoke: PASS")
          PY
