name: CBI v6.4 C279 Task2 apply

on:
  push:
    branches:
      - cbi-v64-release-candidate-c279-diagnostic-a311a2a5
    paths:
      - .github/workflows/cbi-v64-c279-task2-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Apply exact Task2 implementation
        shell: python
        run: |
          from pathlib import Path

          remote_path = Path("mcp/remote_transport.py")
          remote = remote_path.read_text(encoding="utf-8")
          anchor = '''class RemoteTransportError(Exception):
              """Transport-layer request rejection with an HTTP status and JSON-RPC code."""

              def __init__(self, message: str, *, http_status: int = 400, rpc_code: int = -32600):
                  super().__init__(message)
                  self.http_status = int(http_status)
                  self.rpc_code = int(rpc_code)


          @dataclass(frozen=True)
          class RemoteAuthConfig:
          '''
          replacement = '''class RemoteTransportError(Exception):
              """Transport-layer request rejection with an HTTP status and JSON-RPC code."""

              def __init__(self, message: str, *, http_status: int = 400, rpc_code: int = -32600):
                  super().__init__(message)
                  self.http_status = int(http_status)
                  self.rpc_code = int(rpc_code)


          def require_static_bearer(headers: Mapping[str, str], expected_token: str) -> None:
              """Authorize only the exact private static bearer; never OAuth-fallback."""
              authorization = str(headers.get("Authorization") or headers.get("authorization") or "")
              prefix = "Bearer "
              if not authorization.startswith(prefix):
                  raise RemoteTransportError(
                      "Bearer authentication required", http_status=401, rpc_code=-32001
                  )
              supplied = authorization[len(prefix):].strip()
              if not supplied:
                  raise RemoteTransportError(
                      "Bearer authentication required", http_status=401, rpc_code=-32001
                  )
              expected = str(expected_token or "")
              if not expected or not hmac.compare_digest(supplied, expected):
                  raise RemoteTransportError(
                      "Invalid bearer credential", http_status=401, rpc_code=-32001
                  )


          @dataclass(frozen=True)
          class RemoteAuthConfig:
          '''
          if remote.count(anchor) != 1:
              raise SystemExit("remote transport auth anchor drift")
          remote_path.write_text(remote.replace(anchor, replacement), encoding="utf-8")

          oauth_path = Path("mcp/chatgpt_oauth_transport.py")
          oauth = oauth_path.read_text(encoding="utf-8")
          const_anchor = '_STATE_TTL_SECONDS = 10 * 60\n'
          if oauth.count(const_anchor) != 1:
              raise SystemExit("oauth constant anchor drift")
          oauth = oauth.replace(
              const_anchor,
              const_anchor + '_C279_EXPORT_PATH = "/internal/v64/c279-session-export"\n',
          )

          class_anchor = '''class ChatGPTOAuthRequestHandler(base.RemoteMcpRequestHandler):
              @property
              def public_base(self) -> str:
                  return self.server.public_base  # type: ignore[attr-defined]
          '''
          class_replacement = '''class ChatGPTOAuthRequestHandler(base.RemoteMcpRequestHandler):
              @property
              def public_base(self) -> str:
                  return self.server.public_base  # type: ignore[attr-defined]

              @property
              def diagnostic_export(self) -> Callable[[], dict[str, Any]] | None:
                  return getattr(self.server, "diagnostic_export", None)  # type: ignore[attr-defined]

              @property
              def diagnostic_static_bearer(self) -> str:
                  return str(getattr(self.server, "diagnostic_static_bearer", "") or "")  # type: ignore[attr-defined]

              def _diagnostic_parts(self) -> tuple[bool, bool]:
                  parsed = urllib.parse.urlsplit(self.path)
                  return parsed.path == _C279_EXPORT_PATH, bool(parsed.query or parsed.fragment)

              def _diagnostic_post(self) -> None:
                  callback = self.diagnostic_export
                  is_route, has_suffix = self._diagnostic_parts()
                  if not is_route or callback is None or has_suffix:
                      self._send_empty(HTTPStatus.NOT_FOUND)
                      return
                  try:
                      base.require_static_bearer(self.headers, self.diagnostic_static_bearer)
                  except base.RemoteTransportError as exc:
                      self._send_json(exc.http_status, {"error": str(exc)})
                      return

                  try:
                      content_type = str(self.headers.get("Content-Type") or "").split(";", 1)[0].strip().lower()
                      if content_type != "application/json":
                          raise ValueError("Content-Type must be application/json")
                      length = int(str(self.headers.get("Content-Length") or "0"))
                      if length <= 0 or length > 4096:
                          raise ValueError("invalid diagnostic request body size")
                      raw = self.rfile.read(length)
                      request = json.loads(raw.decode("utf-8"))
                      if not isinstance(request, dict) or request:
                          raise ValueError("diagnostic request body must be an empty JSON object")
                  except (UnicodeDecodeError, json.JSONDecodeError, TypeError, ValueError):
                      self._send_json(HTTPStatus.BAD_REQUEST, {"error": "invalid_request"})
                      return

                  try:
                      result = callback()
                  except Exception as exc:
                      status = int(getattr(exc, "http_status", HTTPStatus.SERVICE_UNAVAILABLE))
                      code = str(getattr(exc, "code", "DIAGNOSTIC_EXPORT_FAILED"))
                      if status not in {HTTPStatus.CONFLICT, HTTPStatus.REQUEST_ENTITY_TOO_LARGE}:
                          status = HTTPStatus.SERVICE_UNAVAILABLE
                          code = "DIAGNOSTIC_EXPORT_FAILED"
                      self._send_json(status, {"error": code})
                      return
                  if not isinstance(result, dict):
                      self._send_json(
                          HTTPStatus.SERVICE_UNAVAILABLE,
                          {"error": "DIAGNOSTIC_EXPORT_FAILED"},
                      )
                      return
                  self._send_json(HTTPStatus.OK, result)
          '''
          if oauth.count(class_anchor) != 1:
              raise SystemExit("oauth handler class anchor drift")
          oauth = oauth.replace(class_anchor, class_replacement)

          get_anchor = '''    def do_GET(self) -> None:  # noqa: N802
                  path = self._path()
          '''
          get_replacement = '''    def do_GET(self) -> None:  # noqa: N802
                  is_route, has_suffix = self._diagnostic_parts()
                  if is_route:
                      if self.diagnostic_export is None or has_suffix:
                          self._send_empty(HTTPStatus.NOT_FOUND)
                      else:
                          self._send_empty(HTTPStatus.METHOD_NOT_ALLOWED)
                      return
                  path = self._path()
          '''
          if oauth.count(get_anchor) != 1:
              raise SystemExit("oauth GET anchor drift")
          oauth = oauth.replace(get_anchor, get_replacement)

          post_anchor = '''    def do_POST(self) -> None:  # noqa: N802
                  if self._path() != "/oauth/token":
                      super().do_POST()
                      return
          '''
          post_replacement = '''    def do_DELETE(self) -> None:  # noqa: N802
                  is_route, has_suffix = self._diagnostic_parts()
                  if is_route:
                      if self.diagnostic_export is None or has_suffix:
                          self._send_empty(HTTPStatus.NOT_FOUND)
                      else:
                          self._send_empty(HTTPStatus.METHOD_NOT_ALLOWED)
                      return
                  super().do_DELETE()

              def do_POST(self) -> None:  # noqa: N802
                  is_route, _has_suffix = self._diagnostic_parts()
                  if is_route:
                      self._diagnostic_post()
                      return
                  if self._path() != "/oauth/token":
                      super().do_POST()
                      return
          '''
          if oauth.count(post_anchor) != 1:
              raise SystemExit("oauth POST anchor drift")
          oauth = oauth.replace(post_anchor, post_replacement)

          serve_anchor = '''def serve(
              dispatch: Callable[[str, dict[str, Any]], Any],
              *,
              health: Callable[[], dict[str, Any]] | None = None,
              host: str | None = None,
              port: int | None = None,
          ) -> int:
          '''
          serve_replacement = '''def serve(
              dispatch: Callable[[str, dict[str, Any]], Any],
              *,
              health: Callable[[], dict[str, Any]] | None = None,
              host: str | None = None,
              port: int | None = None,
              diagnostic_export: Callable[[], dict[str, Any]] | None = None,
              diagnostic_static_bearer: str = "",
          ) -> int:
          '''
          if oauth.count(serve_anchor) != 1:
              raise SystemExit("oauth serve signature anchor drift")
          oauth = oauth.replace(serve_anchor, serve_replacement)

          server_anchor = '''    server = base._ReusableThreadingHTTPServer((bind_host, bind_port), ChatGPTOAuthRequestHandler)
              server.app = app  # type: ignore[attr-defined]
              server.public_base = public_base  # type: ignore[attr-defined]
          '''
          server_replacement = '''    server = base._ReusableThreadingHTTPServer((bind_host, bind_port), ChatGPTOAuthRequestHandler)
              server.app = app  # type: ignore[attr-defined]
              server.public_base = public_base  # type: ignore[attr-defined]
              server.diagnostic_export = diagnostic_export  # type: ignore[attr-defined]
              server.diagnostic_static_bearer = str(diagnostic_static_bearer or "")  # type: ignore[attr-defined]
          '''
          if oauth.count(server_anchor) != 1:
              raise SystemExit("oauth server binding anchor drift")
          oauth_path.write_text(oauth.replace(server_anchor, server_replacement), encoding="utf-8")

      - name: Verify Task2 targeted regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input tzdata==2026.3
          python -m unittest tests.test_v64_c279_export_transport -v
          python -m unittest discover -s tests -p "test_*remote*transport*.py" -v
          python mcp/v6_protocol_test.py
          python mcp/v61_hardening_protocol_test.py
          git diff --check

      - name: Commit verified Task2 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cbi-v64-c279-task2-apply.yml
          git config user.name "Scorp96"
          git config user.email "130877686+Scorp96@users.noreply.github.com"
          git add mcp/remote_transport.py mcp/chatgpt_oauth_transport.py .github/workflows/cbi-v64-c279-task2-apply.yml
          git commit -m "feat(v64): add static-admin-only diagnostic HTTP hook"
          git push origin HEAD:cbi-v64-release-candidate-c279-diagnostic-a311a2a5
