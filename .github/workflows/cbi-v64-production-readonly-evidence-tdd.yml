name: CBI v6.4 production read-only evidence TDD

on:
  push:
    branches:
      - cbi-v64-production-readonly-evidence-20260910

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned timezone data
        run: python -m pip install --disable-pip-version-check --no-input tzdata==2026.3
      - name: Run authoritative source evidence contract
        run: python -m unittest tests.test_v64_authoritative_source_evidence
