name: CBI v6.4 production postdeploy wall-clock closure r2

on:
  push:
    branches:
      - cbi-v64-production-postdeploy-wallclock-r2-20260919
    paths:
      - '.github/workflows/cbi-v64-production-postdeploy-wallclock-r2.yml'

permissions:
  contents: read

jobs:
  closure:
    name: Production wall-clock postdeploy r2
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify bounded crawler semantics read only
        env:
          CBI_PRODUCTION_URL: https://cbi-v61-preview.onrender.com
          CBI_PRODUCTION_BEARER_TOKEN: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
          EXPECTED_SHA: 675a629d2eb6d1f92e48bc03382fc999750c9a7d
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures,json,os,statistics,time,urllib.error,urllib.request

          base=os.environ["CBI_PRODUCTION_URL"].rstrip("/")
          token=os.environ["CBI_PRODUCTION_BEARER_TOKEN"]
          expected=os.environ["EXPECTED_SHA"].lower()

          def http(req,timeout=75):
              t=time.monotonic()
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return r.status,dict(r.headers.items()),json.loads(r.read().decode()),time.monotonic()-t
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  try:p=json.loads(raw)
                  except Exception:p={"raw":raw[:1000]}
                  return e.code,dict(e.headers.items()),p,time.monotonic()-t

          s,_,h,_=http(urllib.request.Request(base+"/healthz",headers={"Accept":"application/json"}),30)
          if s!=200 or h.get("status")!="ok": raise SystemExit("HEALTH_NOT_OK")
          ident=h.get("deployment_identity") or {}
          if str(ident.get("git_sha") or "").lower()!=expected: raise SystemExit("SHA_MISMATCH")
          runtime=h.get("crawler_runtime") or {}
          if runtime.get("max_wall_seconds")!=50.0: raise SystemExit("WALL_NOT_50")
          if runtime.get("max_attempt_envelope_seconds")!=30.0: raise SystemExit("ENVELOPE_NOT_30")

          rid=1
          def rpc(method,params,timeout=75):
              global rid
              this=rid; rid+=1
              body=json.dumps({"jsonrpc":"2.0","id":this,"method":method,"params":params},separators=(",",":")).encode()
              req=urllib.request.Request(base+"/mcp",data=body,method="POST",headers={
                  "Authorization":"Bearer "+token,"Content-Type":"application/json",
                  "Accept":"application/json","MCP-Protocol-Version":"2026-07-28"})
              status,headers,p,elapsed=http(req,timeout)
              if status!=200: raise RuntimeError("HTTP:"+json.dumps({"status":status,"elapsed":round(elapsed,3)},sort_keys=True))
              if p.get("id")!=this or p.get("error"): raise RuntimeError("RPC:"+json.dumps(p,sort_keys=True)[:1500])
              return p.get("result") or {},elapsed

          listed,_=rpc("tools/list",{},45)
          desc={x.get("name"):x for x in listed.get("tools",[]) if isinstance(x,dict)}.get("execute_public_crawl") or {}
          contract=desc.get("contract") or {}
          for key in ("bounded_wall_clock","bounded_attempt_envelope","partial_failure_fail_closed",
                      "source_throttle_fail_closed","source_access_blocked_fail_closed","source_unavailable_fail_closed"):
              if contract.get(key) is not True: raise SystemExit("CONTRACT_MISSING:"+key)

          def crawl(task_id,source_family,seed,query,timeout_seconds,max_retries):
              call,elapsed=rpc("tools/call",{"name":"execute_public_crawl","arguments":{
                  "task":{"task_id":task_id,"source_family":source_family,
                          "company_name":"Ferreterias La Quinta Inc","query":query},
                  "seed_url":seed,"max_pages":1,"browser_escalation":False,
                  "timeout_seconds":timeout_seconds,"max_retries":max_retries}},65)
              return call.get("structuredContent") or {},elapsed

          blocked,e1=crawl(
              "PROD59R2-403","public_directory",
              "https://www.findglocal.com/PR/Mayaguez/751821588200868/Ferreterias-La-Quinta%2C-Mayaguez",
              "Ferreterias La Quinta Mayaguez contact phone",15,1)
          if blocked.get("result")!="BLOCKED": raise SystemExit("403_NOT_BLOCKED")
          if blocked.get("status") not in {"SOURCE_ACCESS_BLOCKED","SOURCE_UNAVAILABLE"}:
              raise SystemExit("403_BAD_STATUS")
          if blocked.get("fallback_required") is not True or blocked.get("negative_contact_conclusion_allowed") is not False:
              raise SystemExit("403_FAILCLOSED_BROKEN")
          if blocked.get("production_route_ownership_promoted") is not False: raise SystemExit("403_PROMOTED")
          if e1>=60: raise SystemExit("403_OUTER_TIMEOUT")

          fb,e2=crawl(
              "PROD59R2-FB","public_social",
              "https://www.facebook.com/ferreteriaslaquintainc/",
              "Ferreterias La Quinta Mayaguez email phone whatsapp",15,1)
          if fb.get("status") in {"SOURCE_THROTTLED","SOURCE_ACCESS_BLOCKED","SOURCE_UNAVAILABLE"}:
              if fb.get("result")!="BLOCKED" or fb.get("fallback_required") is not True:
                  raise SystemExit("FB_FAILCLOSED_BAD")
              if fb.get("negative_contact_conclusion_allowed") is not False:
                  raise SystemExit("FB_FALSE_NEGATIVE_ALLOWED")
          elif fb.get("status")=="CRAWL_EXECUTED":
              if fb.get("result")!="POSITIVE" or not (fb.get("route_candidates") or []):
                  raise SystemExit("FB_FALSE_NEGATIVE")
          else:
              raise SystemExit("FB_UNEXPECTED_STATUS:"+str(fb.get("status")))
          if fb.get("production_route_ownership_promoted") is not False: raise SystemExit("FB_PROMOTED")
          if e2>=60: raise SystemExit("FB_OUTER_TIMEOUT")

          fallback,e3=crawl(
              "PROD59R2-FALLBACK","public_directory",
              "https://www.barretobestblocks.com/ferreterias/",
              "Ferreteria La Quinta Mayaguez contact phone",20,0)
          routes=fallback.get("route_candidates") or []
          if fallback.get("status")=="CRAWL_EXECUTED":
              if fallback.get("result")=="POSITIVE":
                  if not routes: raise SystemExit("FALLBACK_POSITIVE_WITHOUT_ROUTES")
                  if fallback.get("verified") is not False or fallback.get("owner_scope")!="UNVERIFIED":
                      raise SystemExit("FALLBACK_OWNERSHIP_BAD")
              elif fallback.get("result")=="NEGATIVE_EXHAUSTED":
                  raise SystemExit("FALLBACK_FALSE_NEGATIVE_EXHAUSTED")
              else:
                  raise SystemExit("FALLBACK_BAD_EXECUTED_RESULT")
          elif fallback.get("status") in {"SOURCE_THROTTLED","SOURCE_ACCESS_BLOCKED","SOURCE_UNAVAILABLE"}:
              if fallback.get("result")!="BLOCKED" or fallback.get("fallback_required") is not True:
                  raise SystemExit("FALLBACK_FAILCLOSED_BAD")
              if fallback.get("negative_contact_conclusion_allowed") is not False:
                  raise SystemExit("FALLBACK_FALSE_NEGATIVE_ALLOWED")
          else:
              raise SystemExit("FALLBACK_UNEXPECTED_STATUS:"+str(fallback.get("status")))
          if fallback.get("production_route_ownership_promoted") is not False: raise SystemExit("FALLBACK_PROMOTED")
          if e3>=60: raise SystemExit("FALLBACK_OUTER_TIMEOUT")

          def burst_one(i):
              request_id=40000+i
              body=json.dumps({"jsonrpc":"2.0","id":request_id,"method":"tools/list","params":{}},separators=(",",":")).encode()
              attempts=[]
              for n in range(1,4):
                  req=urllib.request.Request(base+"/mcp",data=body,method="POST",headers={
                      "Authorization":"Bearer "+token,"Content-Type":"application/json",
                      "Accept":"application/json","MCP-Protocol-Version":"2026-07-28"})
                  status,headers,p,elapsed=http(req,45)
                  attempts.append({"status":status,"elapsed":round(elapsed,3),"retry_after":headers.get("Retry-After")})
                  if status==200:
                      return {"ok":p.get("id")==request_id and isinstance(p.get("result"),dict),"attempts":attempts}
                  if status!=429:return {"ok":False,"attempts":attempts}
                  time.sleep(0.25*(2**(n-1)))
              return {"ok":False,"attempts":attempts}

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              burst=list(ex.map(burst_one,range(16)))
          bad=[x for x in burst if not x["ok"]]
          if bad: raise SystemExit("BURST_UNHANDLED:"+json.dumps(bad,sort_keys=True)[:2000])
          first429=sum(1 for x in burst if x["attempts"][0]["status"]==429)
          all429=sum(1 for x in burst for a in x["attempts"] if a["status"]==429)
          lat=[a["elapsed"] for x in burst for a in x["attempts"] if a["status"]==200]

          print(json.dumps({
              "schema":"cbi.v64-production-wallclock-postdeploy-r2.v1",
              "status":"VERIFIED",
              "production_git_sha":expected,
              "production_write_performed":False,
              "runtime":{"max_wall_seconds":runtime.get("max_wall_seconds"),
                         "max_attempt_envelope_seconds":runtime.get("max_attempt_envelope_seconds")},
              "access_blocked":{"status":blocked.get("status"),"result":blocked.get("result"),
                                "execution_budget_exhausted":blocked.get("execution_budget_exhausted"),
                                "elapsed_seconds":round(e1,3)},
              "facebook":{"status":fb.get("status"),"result":fb.get("result"),
                          "route_count":len(fb.get("route_candidates") or []),
                          "execution_budget_exhausted":fb.get("execution_budget_exhausted"),
                          "elapsed_seconds":round(e2,3)},
              "fallback":{"status":fallback.get("status"),"result":fallback.get("result"),
                          "route_count":len(routes),
                          "route_kinds":sorted({str(x.get("kind") or "") for x in routes}),
                          "owner_scope":fallback.get("owner_scope"),
                          "verified":fallback.get("verified"),
                          "execution_budget_exhausted":fallback.get("execution_budget_exhausted"),
                          "elapsed_seconds":round(e3,3)},
              "mcp_ingress_burst":{"total_requests":16,"max_concurrency":4,"unhandled_failures":0,
                                  "first_attempt_429":first429,"all_429_attempts":all429,
                                  "latency_ms_p50":round(statistics.median(lat)*1000,1) if lat else None,
                                  "latency_ms_max":round(max(lat)*1000,1) if lat else None}
          },sort_keys=True))
          PY
