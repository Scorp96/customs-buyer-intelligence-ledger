name: CBI v6 load acceptance

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Acceptance profile
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
      canonical_accounts:
        description: Canonical account count for full profile
        required: true
        default: "5000"
        type: string

permissions:
  contents: read

concurrency:
  group: cbi-v6-load-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load-acceptance:
    name: ${{ inputs.profile }} load acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Smoke performance acceptance
        if: ${{ inputs.profile == 'smoke' }}
        run: python scripts/run_v6_load_acceptance.py --profile smoke --enforce-targets

      - name: Full structural load acceptance
        if: ${{ inputs.profile == 'full' }}
        run: >-
          python scripts/run_v6_load_acceptance.py
          --profile full
          --canonical-accounts "${{ inputs.canonical_accounts }}"
