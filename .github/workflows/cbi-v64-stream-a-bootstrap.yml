name: CBI v6.4 Stream A repair and verify

on:
  push:
    branches:
      - cbi-v64-semantic-forward-port-58e14973
    paths:
      - .cbi-v64-bootstrap/READY

permissions:
  contents: write

concurrency:
  group: cbi-v64-stream-a-repair
  cancel-in-progress: false

jobs:
  repair-stream-a:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: cbi-v64-semantic-forward-port-58e14973

      - name: Verify immutable remote baselines
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/cbi-v6-3-demand-expansion | awk '{print $1}')" = '58e14973c62cca5a9daefa7b4012e427135736d5'
          test "$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')" = 'a311a2a57ee43a1f1a3b2819bf28946566b05692'
          git merge-base --is-ancestor 58e14973c62cca5a9daefa7b4012e427135736d5 HEAD

      - name: Apply minimal optional lower-capability fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('unified_runtime/research_orchestration_hardening.py')
          text = path.read_text(encoding='utf-8')
          old = '        claims = self._claims_view(state)\n'
          new = (
              '        claims_view = getattr(self, "_claims_view", None)\n'
              '        claims = claims_view(state) if callable(claims_view) else {}\n'
          )
          if old not in text:
              raise SystemExit('EXPECTED_STREAM_A_CLAIMS_CALL_NOT_FOUND')
          if text.count(old) != 1:
              raise SystemExit('STREAM_A_CLAIMS_CALL_NOT_UNIQUE')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- unified_runtime/research_orchestration_hardening.py

      - name: Red-gate regression now passes
        run: python -m unittest -q tests/test_v61_research_orchestration_hardening.py

      - name: Gate v63 candidate anchor
        run: python -m unittest -q tests/test_v63_candidate_anchor.py

      - name: Gate v63 research scheduler
        run: python -m unittest -q tests/test_v63_research_scheduler.py

      - name: Gate all v63 tests
        run: python -m unittest discover -s tests -p 'test_v63_*.py' -q

      - name: Gate MCP v6 protocol
        run: python mcp/v6_protocol_test.py

      - name: Gate MCP v61 hardening protocol
        run: python mcp/v61_hardening_protocol_test.py

      - name: Gate full repository suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Commit repair and clean temporary bootstrap evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unified_runtime/research_orchestration_hardening.py
          git commit -m 'fix(v64): tolerate optional lower claims view in route diagnostics'
          git rm -r .cbi-v64-bootstrap .cbi-v64-diagnostics .github/workflows/cbi-v64-stream-a-bootstrap.yml
          git commit -m 'chore(v64): remove Stream A bootstrap diagnostics'
          git diff --check 58e14973c62cca5a9daefa7b4012e427135736d5..HEAD
          test "$(git ls-remote origin refs/heads/cbi-v6-3-demand-expansion | awk '{print $1}')" = '58e14973c62cca5a9daefa7b4012e427135736d5'
          test "$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')" = 'a311a2a57ee43a1f1a3b2819bf28946566b05692'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/cbi-v64-semantic-forward-port-58e14973
