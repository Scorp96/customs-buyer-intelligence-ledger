name: CBI v6.4 Stream A final cross-version verification

on:
  push:
    branches: [cbi-v64-semantic-forward-port-58e14973]
    paths: [.cbi-v64-bootstrap/READY]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: cbi-v64-semantic-forward-port-58e14973
      - name: Verify immutable refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/cbi-v6-3-demand-expansion | awk '{print $1}')" = '58e14973c62cca5a9daefa7b4012e427135736d5'
          test "$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')" = 'a311a2a57ee43a1f1a3b2819bf28946566b05692'
      - name: Apply bounded cross-version test repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('tests/test_v61_independent_audit.py'); t=p.read_text(encoding='utf-8')
          anchor='    def resolve_every_claim(self) -> tuple[dict, dict]:\n'
          helper='''    def support_root_identity_for_promotion(self) -> None:\n        result = self.compile([\n            self.observation("identity.legal_entity", suffix="root-legal-entity-for-promotion", value={"legal_name": "Synthetic Audit Buyer"}),\n            self.observation("identity.ultimate_buyer", suffix="root-ultimate-buyer-for-promotion", value={"ultimate_buyer": "Synthetic Audit Buyer"}),\n        ], "BUNDLE-V64-ROOT-IDENTITY-FOR-PROMOTION")\n        self.assertEqual(result["rejected_count"], 0)\n\n'''
          if helper not in t:
              if t.count(anchor)!=1: raise SystemExit(f'independent_helper_anchor={t.count(anchor)}')
              t=t.replace(anchor,helper+anchor,1)
          a='        self.assertEqual(eligible["stage"], "ANCHOR_ELIGIBLE")\n        promoted = self.runtime.promote_anchor({\n'
          b='        self.assertEqual(eligible["stage"], "ANCHOR_ELIGIBLE")\n        self.support_root_identity_for_promotion()\n        promoted = self.runtime.promote_anchor({\n'
          if b not in t:
              if t.count(a)!=1: raise SystemExit(f'monotonic_anchor={t.count(a)}')
              t=t.replace(a,b,1)
          a='        ], "BUNDLE-V61-PREMATURE-BRANCHES")\n        self.runtime.promote_anchor({\n'
          b='        ], "BUNDLE-V61-PREMATURE-BRANCHES")\n        self.support_root_identity_for_promotion()\n        self.runtime.promote_anchor({\n'
          if b not in t:
              if t.count(a)!=1: raise SystemExit(f'prepromotion_anchor={t.count(a)}')
              t=t.replace(a,b,1)
          p.write_text(t,encoding='utf-8')

          p=Path('tests/test_v61_peer_pivot_wal_recovery.py'); t=p.read_text(encoding='utf-8')
          a='''            self._observation(\n                "trade.import_activity",\n                "peer-trade",\n                owner_type="PEER",\n                owner_id=peer_id,\n            ),\n        ], "BUNDLE-PEER-WAL-FACTS")\n'''
          b='''            self._observation(\n                "trade.import_activity",\n                "peer-trade",\n                owner_type="PEER",\n                owner_id=peer_id,\n            ),\n            self._observation("identity.legal_entity", "root-legal-entity"),\n            self._observation("identity.ultimate_buyer", "root-ultimate-buyer"),\n        ], "BUNDLE-PEER-WAL-FACTS")\n'''
          if b not in t:
              if t.count(a)!=1: raise SystemExit(f'wal_anchor={t.count(a)}')
              t=t.replace(a,b,1)
          p.write_text(t,encoding='utf-8')

          p=Path('tests/test_v64_route_promotion_safety.py'); t=p.read_text(encoding='utf-8')
          a='''    except ModuleNotFoundError:\n        for name in list(sys.modules):\n            if name == "unified_runtime" or name.startswith("unified_runtime."):\n                sys.modules.pop(name, None)\n        root = Path(__file__).resolve().parents[1]\n        package = types.ModuleType("unified_runtime")\n'''
          b='''    except ModuleNotFoundError:\n        for name in list(sys.modules):\n            if name == "unified_runtime" or name.startswith("unified_runtime."):\n                sys.modules.pop(name, None)\n        root = Path(__file__).resolve().parents[1]\n        if (root / "unified_runtime" / "__init__.py").exists():\n            from unified_runtime.research_orchestration_hardening import V61ResearchOrchestrationHardeningMixin  # type: ignore\n            from unified_runtime.errors import ValidationError  # type: ignore\n            return V61ResearchOrchestrationHardeningMixin, ValidationError\n        package = types.ModuleType("unified_runtime")\n'''
          if b not in t:
              if t.count(a)!=1: raise SystemExit(f'loader_anchor={t.count(a)}')
              t=t.replace(a,b,1)
          p.write_text(t,encoding='utf-8')

          p=Path('tests/test_v6_architecture.py'); t=p.read_text(encoding='utf-8')
          a='''        self.assertEqual(evaluated["stage"], "ANCHOR_ELIGIBLE")\n        self.assertEqual(evaluated["contact_coverage"], {})\n        promoted = self.runtime.promote_anchor({\n'''
          b='''        self.assertEqual(evaluated["stage"], "ANCHOR_ELIGIBLE")\n        self.assertEqual(evaluated["contact_coverage"], {})\n        root_identity = self.compile([\n            self.observation("identity.legal_entity", suffix="root-legal-entity-for-anchor"),\n            self.observation("identity.ultimate_buyer", suffix="root-ultimate-buyer-for-anchor"),\n        ], "BUNDLE-V64-ROOT-IDENTITY-FOR-ANCHOR")\n        self.assertEqual(root_identity["rejected_count"], 0)\n        promoted = self.runtime.promote_anchor({\n'''
          if b not in t:
              if t.count(a)!=1: raise SystemExit(f'v6_arch_anchor={t.count(a)}')
              t=t.replace(a,b,1)
          p.write_text(t,encoding='utf-8')
          PY
          git diff --check
      - name: Gate affected cross-version tests
        shell: bash
        run: |
          python -m unittest -q tests/test_v61_independent_audit.py
          python -m unittest -q tests/test_v61_peer_pivot_wal_recovery.py
          python -m unittest -q tests/test_v64_route_promotion_safety.py tests/test_v6_architecture.py tests/test_v6_properties_and_crash.py
      - name: Gate full repository suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Commit repairs and clean bootstrap diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_v61_independent_audit.py tests/test_v61_peer_pivot_wal_recovery.py tests/test_v64_route_promotion_safety.py tests/test_v6_architecture.py
          git commit -m 'test(v64): align promotion preconditions and loader isolation'
          git rm -r .cbi-v64-bootstrap .cbi-v64-diagnostics .github/workflows/cbi-v64-stream-a-bootstrap.yml
          git commit -m 'chore(v64): remove Stream A bootstrap diagnostics'
          git diff --check 58e14973c62cca5a9daefa7b4012e427135736d5..HEAD
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/cbi-v6-3-demand-expansion | awk '{print $1}')" = '58e14973c62cca5a9daefa7b4012e427135736d5'
          test "$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')" = 'a311a2a57ee43a1f1a3b2819bf28946566b05692'
          git push origin HEAD:refs/heads/cbi-v64-semantic-forward-port-58e14973
