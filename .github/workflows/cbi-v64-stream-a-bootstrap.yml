name: CBI v6.4 Stream A final verification

on:
  push:
    branches: [cbi-v64-semantic-forward-port-58e14973]
    paths: [.cbi-v64-bootstrap/READY]

permissions:
  contents: write

jobs:
  verify-stream-a:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: cbi-v64-semantic-forward-port-58e14973
      - name: Verify immutable refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/cbi-v6-3-demand-expansion | awk '{print $1}')" = '58e14973c62cca5a9daefa7b4012e427135736d5'
          test "$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')" = 'a311a2a57ee43a1f1a3b2819bf28946566b05692'
      - name: Forward-port stale v61 fixture to strong direct freshness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_v61_research_orchestration_hardening.py')
          t=p.read_text(encoding='utf-8')
          marker='    def test_account_state_reuses_normalized_outreach_and_routes(self):\n'
          start=t.index(marker)
          end=t.index('\n    def ', start+len(marker))
          block=t[start:end]
          old='                "source": {"freshness": "CURRENT_LIKELY"},\n'
          new='                "source": {"freshness": "CURRENT_CONFIRMED"},\n'
          if block.count(old)!=1:
              raise SystemExit(f'STALE_FIXTURE_ANCHOR_COUNT={block.count(old)}')
          block=block.replace(old,new,1)
          p.write_text(t[:start]+block+t[end:],encoding='utf-8')
          PY
          git diff --check
      - name: Gate v61 research orchestration
        run: python -m unittest -q tests/test_v61_research_orchestration_hardening.py
      - name: Gate v64 route and promotion safety
        run: python -m unittest -q tests/test_v64_route_promotion_safety.py
      - name: Gate v63 candidate anchor
        run: python -m unittest -q tests/test_v63_candidate_anchor.py
      - name: Gate v63 research scheduler
        run: python -m unittest -q tests/test_v63_research_scheduler.py
      - name: Gate all v63 tests
        run: python -m unittest discover -s tests -p 'test_v63_*.py' -q
      - name: Gate MCP v6 protocol
        run: python mcp/v6_protocol_test.py
      - name: Gate MCP v61 hardening protocol
        run: python mcp/v61_hardening_protocol_test.py
      - name: Gate full repository suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Commit forward-port and remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_v61_research_orchestration_hardening.py
          git commit -m 'test(v64): align v61 route fixture with strong direct freshness'
          git rm -r .cbi-v64-bootstrap .cbi-v64-diagnostics .github/workflows/cbi-v64-stream-a-bootstrap.yml
          git commit -m 'chore(v64): remove Stream A bootstrap diagnostics'
          git diff --check 58e14973c62cca5a9daefa7b4012e427135736d5..HEAD
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/cbi-v6-3-demand-expansion | awk '{print $1}')" = '58e14973c62cca5a9daefa7b4012e427135736d5'
          test "$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')" = 'a311a2a57ee43a1f1a3b2819bf28946566b05692'
          git push origin HEAD:refs/heads/cbi-v64-semantic-forward-port-58e14973
