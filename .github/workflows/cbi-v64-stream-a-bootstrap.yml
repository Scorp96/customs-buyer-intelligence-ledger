name: CBI v6.4 Stream A repaired red-gate diagnostic

on:
  push:
    branches: [cbi-v64-semantic-forward-port-58e14973]
    paths: [.cbi-v64-bootstrap/READY]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: cbi-v64-semantic-forward-port-58e14973
      - name: Verify refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/cbi-v6-3-demand-expansion | awk '{print $1}')" = '58e14973c62cca5a9daefa7b4012e427135736d5'
          test "$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')" = 'a311a2a57ee43a1f1a3b2819bf28946566b05692'
      - name: Apply two bounded compatibility repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('unified_runtime/research_orchestration_hardening.py')
          t=p.read_text(encoding='utf-8')
          a='        account_id = state["start"]["account"]["account_id"]\n        claims = self._claims_view(state)\n        claim = claims.get("contact.company_route") if isinstance(claims, dict) else None\n'
          b='        account_id = state["start"]["account"]["account_id"]\n        claims_view = getattr(self, "_claims_view", None)\n        claims = claims_view(state) if callable(claims_view) else {}\n        claim = claims.get("contact.company_route") if isinstance(claims, dict) else None\n'
          if t.count(a)!=1: raise SystemExit(f'route_anchor={t.count(a)}')
          t=t.replace(a,b,1)
          a='    def _peer_reconciliation_view(\n        self,\n        state: dict[str, Any],\n    ) -> list[dict[str, Any]]:\n        root_blockers = self._promotion_identity_blockers(state)\n        rows: list[dict[str, Any]] = []\n        peers = state.get("peers") or {}\n        if not isinstance(peers, dict):\n            return rows\n'
          b='    def _peer_reconciliation_view(\n        self,\n        state: dict[str, Any],\n    ) -> list[dict[str, Any]]:\n        rows: list[dict[str, Any]] = []\n        peers = state.get("peers") or {}\n        if not isinstance(peers, dict) or not peers:\n            return rows\n        root_blockers = self._promotion_identity_blockers(state)\n'
          if t.count(a)!=1: raise SystemExit(f'peer_anchor={t.count(a)}')
          p.write_text(t.replace(a,b,1),encoding='utf-8')
          PY
          git diff --check
      - name: Capture repaired red gate and push diagnostics
        shell: bash
        run: |
          set -u
          mkdir -p .cbi-v64-diagnostics
          set +e
          python -m unittest -q tests/test_v61_research_orchestration_hardening.py > .cbi-v64-diagnostics/v61_after_two_repairs.txt 2>&1
          rc=$?
          set -e
          printf '\nEXIT_CODE=%s\n' "$rc" >> .cbi-v64-diagnostics/v61_after_two_repairs.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unified_runtime/research_orchestration_hardening.py .cbi-v64-diagnostics/v61_after_two_repairs.txt
          git commit -m 'fix(v64): preserve optional diagnostics and empty-peer compatibility'
          git push origin HEAD:refs/heads/cbi-v64-semantic-forward-port-58e14973
          exit "$rc"
