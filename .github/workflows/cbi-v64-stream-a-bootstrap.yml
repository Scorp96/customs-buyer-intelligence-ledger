name: CBI v6.4 source baseline full-suite diagnostic

on:
  push:
    branches: [cbi-v64-semantic-forward-port-58e14973]
    paths: [.cbi-v64-bootstrap/READY]

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: cbi-v64-semantic-forward-port-58e14973
      - name: Verify refs and create source worktree
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='58e14973c62cca5a9daefa7b4012e427135736d5'
          PROD='a311a2a57ee43a1f1a3b2819bf28946566b05692'
          test "$(git ls-remote origin refs/heads/cbi-v6-3-demand-expansion | awk '{print $1}')" = "$SOURCE"
          test "$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')" = "$PROD"
          git worktree add --detach "$RUNNER_TEMP/source-baseline" "$SOURCE"
      - name: Run exact source baseline full suite
        shell: bash
        run: |
          set -u
          mkdir -p .cbi-v64-diagnostics
          set +e
          (cd "$RUNNER_TEMP/source-baseline" && python -m unittest discover -s tests -p 'test_*.py' -q) > .cbi-v64-diagnostics/full_suite_source_58e14973.txt 2>&1
          rc=$?
          set -e
          printf '\nEXIT_CODE=%s\n' "$rc" >> .cbi-v64-diagnostics/full_suite_source_58e14973.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .cbi-v64-diagnostics/full_suite_source_58e14973.txt
          git commit -m 'test(v64): persist authoritative source full-suite baseline'
          test "$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')" = 'a311a2a57ee43a1f1a3b2819bf28946566b05692'
          git push origin HEAD:refs/heads/cbi-v64-semantic-forward-port-58e14973
          exit "$rc"
