name: CBI v6.4 discovery namespace trace

on:
  push:
    branches: [cbi-v64-semantic-forward-port-58e14973]
    paths: [.cbi-v64-bootstrap/READY]

permissions:
  contents: write

jobs:
  trace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: cbi-v64-semantic-forward-port-58e14973
      - name: Verify immutable refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/cbi-v6-3-demand-expansion | awk '{print $1}')" = '58e14973c62cca5a9daefa7b4012e427135736d5'
          test "$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')" = 'a311a2a57ee43a1f1a3b2819bf28946566b05692'
      - name: Apply loader candidate and trace imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_v64_route_promotion_safety.py')
          t=p.read_text(encoding='utf-8')
          a='''    except ModuleNotFoundError:\n        for name in list(sys.modules):\n            if name == "unified_runtime" or name.startswith("unified_runtime."):\n                sys.modules.pop(name, None)\n        root = Path(__file__).resolve().parents[1]\n        package = types.ModuleType("unified_runtime")\n'''
          b='''    except ModuleNotFoundError:\n        for name in list(sys.modules):\n            if name == "unified_runtime" or name.startswith("unified_runtime."):\n                sys.modules.pop(name, None)\n        root = Path(__file__).resolve().parents[1]\n        if (root / "unified_runtime" / "__init__.py").exists():\n            from unified_runtime.research_orchestration_hardening import V61ResearchOrchestrationHardeningMixin  # type: ignore\n            from unified_runtime.errors import ValidationError  # type: ignore\n            return V61ResearchOrchestrationHardeningMixin, ValidationError\n        package = types.ModuleType("unified_runtime")\n'''
          if b not in t:
              if t.count(a)!=1: raise SystemExit(f'loader_anchor={t.count(a)}')
              p.write_text(t.replace(a,b,1), encoding='utf-8')
          PY
          mkdir -p .cbi-v64-diagnostics
          python - <<'PY' > .cbi-v64-diagnostics/discovery_namespace_trace.txt 2>&1
          import importlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tests').resolve()))
          files=sorted(Path('tests').glob('test_*.py'))
          for path in files:
              name=path.stem
              before=sys.modules.get('unified_runtime')
              print('BEFORE', name, 'file=', getattr(before,'__file__',None), 'has_runtime=', hasattr(before,'UnifiedRuntime') if before else None)
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  print('IMPORT_ERROR', name, type(exc).__name__, repr(exc))
              after=sys.modules.get('unified_runtime')
              print('AFTER ', name, 'file=', getattr(after,'__file__',None), 'has_runtime=', hasattr(after,'UnifiedRuntime') if after else None, 'has_tools=', hasattr(after,'CBI_MCP_TOOL_NAMES') if after else None)
              if after is not None and getattr(after,'__file__',None) is None:
                  print('FIRST_SYNTHETIC_AFTER', name)
                  break
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .cbi-v64-diagnostics/discovery_namespace_trace.txt
          git commit -m 'test(v64): trace unittest discovery namespace pollution'
          git push origin HEAD:refs/heads/cbi-v64-semantic-forward-port-58e14973
