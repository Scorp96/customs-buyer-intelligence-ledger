name: CBI v6.4 loader isolation diagnostic

on:
  push:
    branches: [cbi-v64-semantic-forward-port-58e14973]
    paths: [.cbi-v64-bootstrap/READY]

permissions:
  contents: write

jobs:
  diagnose-loader:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: cbi-v64-semantic-forward-port-58e14973
      - name: Apply candidate test-only repairs and capture loader sequence
        shell: bash
        run: |
          set -u
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_v64_route_promotion_safety.py'); t=p.read_text(encoding='utf-8')
          old='''    except ModuleNotFoundError:\n        for name in list(sys.modules):\n            if name == "unified_runtime" or name.startswith("unified_runtime."):\n                sys.modules.pop(name, None)\n        root = Path(__file__).resolve().parents[1]\n        package = types.ModuleType("unified_runtime")\n'''
          new='''    except ModuleNotFoundError:\n        for name in list(sys.modules):\n            if name == "unified_runtime" or name.startswith("unified_runtime."):\n                sys.modules.pop(name, None)\n        root = Path(__file__).resolve().parents[1]\n        if (root / "unified_runtime" / "__init__.py").exists():\n            from unified_runtime.research_orchestration_hardening import V61ResearchOrchestrationHardeningMixin  # type: ignore\n            from unified_runtime.errors import ValidationError  # type: ignore\n            return V61ResearchOrchestrationHardeningMixin, ValidationError\n        package = types.ModuleType("unified_runtime")\n'''
          if new not in t:
              if t.count(old)!=1: raise SystemExit(f'loader_anchor={t.count(old)}')
              p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          mkdir -p .cbi-v64-diagnostics
          set +e
          python -m unittest -q tests/test_v64_route_promotion_safety.py tests/test_v6_architecture.py tests/test_v6_properties_and_crash.py > .cbi-v64-diagnostics/loader_sequence.txt 2>&1
          rc=$?
          set -e
          printf '\nEXIT_CODE=%s\n' "$rc" >> .cbi-v64-diagnostics/loader_sequence.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .cbi-v64-diagnostics/loader_sequence.txt
          git commit -m 'test(v64): persist loader isolation diagnostic'
          git push origin HEAD:refs/heads/cbi-v64-semantic-forward-port-58e14973
          exit "$rc"
