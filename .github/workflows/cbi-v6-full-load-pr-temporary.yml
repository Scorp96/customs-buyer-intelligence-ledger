name: CBI v6 full load acceptance temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cbi-v6-full-load-temporary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full-load:
    name: 10k evidence 1k pivots 500 peers 5k accounts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run exact v6 large-state target
        run: python scripts/run_v6_load_acceptance.py --profile full --canonical-accounts 5000
