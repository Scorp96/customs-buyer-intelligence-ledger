name: CBI v6.4 backup WAL TDD

on:
  push:
    branches:
      - cbi-v64-backup-wal-hardening-20260909
  workflow_dispatch:

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install timezone data
        run: python -m pip install --disable-pip-version-check --no-input tzdata==2026.3
      - name: Request-scoped snapshot contract
        run: python -m unittest tests.test_v64_request_scoped_verified_snapshot -v
      - name: Stable state-query performance protocol
        run: python -m unittest tests.test_v64_state_query_performance_protocol -v
      - name: Immutable backup object-store contract
        run: python -m unittest tests.test_v64_backup_object_store -v
      - name: Backup retention runtime contract
        run: python -m unittest tests.test_v64_backup_retention_runtime -v
      - name: Production backup replica wiring
        run: python -m unittest tests.test_v64_backup_replica_server_wiring -v
      - name: Sanitized mutation WAL audit contract
        run: python -m unittest tests.test_v64_mutation_wal_audit -v
      - name: WAL audit MCP exposure contract
        run: python -m unittest tests.test_v64_mutation_wal_audit_mcp -v
      - name: Production adapter tool-surface declaration contract
        run: python -m unittest tests.test_v64_production_tool_surface_declaration -v
      - name: Backup retention acceptance runner contract
        run: python -m unittest tests.test_v64_backup_retention_acceptance -v
