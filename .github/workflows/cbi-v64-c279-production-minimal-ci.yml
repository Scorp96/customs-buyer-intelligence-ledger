name: CBI v6.4 C279 minimal production diagnostic CI

on:
  push:
    branches:
      - "cbi-v64-release-candidate-c279-diagnostic-production-minimal-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cbi-v64-c279-production-minimal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-minimal-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "C279_MINIMAL_DIAGNOSTIC_SHA=$GITHUB_SHA"

      - name: Run C279 diagnostic contracts
        run: >-
          python -m unittest -v
          tests.test_v64_c279_single_session_export
          tests.test_v64_c279_export_transport
          tests.test_v64_c279_export_entrypoint_contract
          tests.test_v64_c279_transport_main_forwarding

      - name: Run full repository unittest suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run privacy scan
        run: python tests/privacy_scan.py

      - name: Compile modified runtime modules
        run: >-
          python -m py_compile
          mcp/c279_single_session_export_v64.py
          mcp/chatgpt_oauth_transport.py
          mcp/remote_transport.py
          mcp/server_v61_remote.py
