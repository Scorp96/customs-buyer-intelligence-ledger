name: CBI v6.4 external blocker capability probe

on:
  push:
    branches:
      - cbi-v64-c279-health-probe-a311a2a
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: Non-mutating external capability probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe ruleset write authorization with invalid non-creatable payload
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          url = "https://api.github.com/repos/Scorp96/customs-buyer-intelligence-ledger/rulesets"
          # Empty object is intentionally invalid: required fields name/target/enforcement/rules
          # are absent, so this request cannot create a ruleset even if the caller is authorized.
          body = b"{}"
          req = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":"Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type":"application/json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"cbi-v64-external-capability-probe",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  status = int(response.status)
                  response.read(4096)
          except urllib.error.HTTPError as exc:
              status = int(exc.code)
              exc.read(4096)
          print(f"CBI_RULESET_INVALID_POST_HTTP={status}")
          if 200 <= status < 300:
              raise SystemExit("INVALID_RULESET_PAYLOAD_UNEXPECTEDLY_MUTATED_REPOSITORY")
          if status == 403:
              print("CBI_RULESET_WRITE_CAPABILITY=DENIED_BY_TOKEN")
          elif status == 422:
              print("CBI_RULESET_WRITE_CAPABILITY=AUTHORIZATION_NOT_DISPROVEN_BUT_PAYLOAD_REJECTED")
          else:
              print("CBI_RULESET_WRITE_CAPABILITY=INDETERMINATE_HTTP_" + str(status))

      - name: Probe Render SSH authentication with no key and no command side effect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ssh"
          ssh-keyscan -T 10 ssh.singapore.render.com > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null || true
          set +e
          output="$(ssh \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=10 \
            srv-dab38a3tqb8s73eljmtg@ssh.singapore.render.com true 2>&1)"
          rc=$?
          set -e
          echo "CBI_RENDER_SSH_NO_KEY_RC=$rc"
          # Do not print server text; it may contain account/environment metadata.
          if [ "$rc" -eq 0 ]; then
            echo "CBI_RENDER_SSH_IMPLICIT_AUTH=AVAILABLE"
          else
            echo "CBI_RENDER_SSH_IMPLICIT_AUTH=UNAVAILABLE"
          fi

      - name: Assert release candidate and production refs unchanged
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          prod="$(git ls-remote https://github.com/Scorp96/customs-buyer-intelligence-ledger refs/heads/cbi-v6-cloud-runtime-20260901 | cut -f1)"
          cand="$(git ls-remote https://github.com/Scorp96/customs-buyer-intelligence-ledger refs/heads/cbi-v64-release-candidate-58e14973 | cut -f1)"
          test "$prod" = "a311a2a57ee43a1f1a3b2819bf28946566b05692"
          test "$cand" = "4733a9b3e7286b58828750542c7ad54057cfb8ad"
          echo "CBI_PRODUCTION_REF_UNCHANGED=$prod"
          echo "CBI_RELEASE_CANDIDATE_REF_UNCHANGED=$cand"
