name: CBI v6.4 final positive authoritative acceptance

on:
  push:
    branches:
      - cbi-v64-final-positive-acceptance-20260910

permissions:
  contents: read

concurrency:
  group: cbi-v64-final-positive-authoritative
  cancel-in-progress: false

jobs:
  positive-authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout helper exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Prove helper changes only acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7222fa19c1bace68b0ad4c44a707298966bf15e1"
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/cbi-v64-final-positive-authoritative.yml",
              "scripts/discover_v64_positive_route_candidate.py",
              "scripts/run_v64_final_positive_authoritative.py",
              "tests/test_v64_c279_full_runtime.py",
          }
          changed = set(subprocess.check_output([
              "git", "diff", "--name-only",
              "7222fa19c1bace68b0ad4c44a707298966bf15e1", "HEAD"
          ], text=True).splitlines())
          assert changed == expected, (changed, expected)
          print("HELPER_RUNTIME_DELTA=NONE")
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Run exact-source isolated positive acceptance
        id: acceptance
        continue-on-error: true
        env:
          CBI_V64_DISCOVERY_BEARER: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
        run: python scripts/run_v64_final_positive_authoritative.py

      - name: Validate sanitized artifact only
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "cbi-v64-final-positive"
          artifact = root / "artifact"
          files = {p.name for p in artifact.iterdir()} if artifact.is_dir() else set()
          assert files == {"positive-authoritative-receipt.json"}, files
          receipt = json.loads((artifact / "positive-authoritative-receipt.json").read_text(encoding="utf-8"))
          assert receipt["plaintext_artifact_retained"] is False
          assert receipt["source_runtime_mutation_detected"] is False
          assert receipt["sends_message"] is False
          assert receipt["production_before"] == receipt["production_after"]
          serialized = json.dumps(receipt, sort_keys=True).lower()
          for forbidden in ("payload_base64", "authorization", "bearer ", "maripaz@", "castellexport.com"):
              assert forbidden not in serialized
          print("POSITIVE_AUTHORITATIVE_ARTIFACT_PRIVACY=PASS")
          PY

      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cbi-v64-final-positive-authoritative-${{ github.sha }}
          path: ${{ runner.temp }}/cbi-v64-final-positive/artifact/positive-authoritative-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed unless authoritative positive passed
        if: always()
        shell: bash
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "cbi-v64-final-positive/artifact/positive-authoritative-receipt.json"
          receipt = json.loads(path.read_text(encoding="utf-8"))
          if os.environ.get("ACCEPTANCE_OUTCOME") != "success" or receipt.get("verified") is not True:
              print("POSITIVE_AUTHORITATIVE_GATE=FAIL_CLOSED")
              raise SystemExit(1)
          print("POSITIVE_AUTHORITATIVE_GATE=GREEN")
          PY
