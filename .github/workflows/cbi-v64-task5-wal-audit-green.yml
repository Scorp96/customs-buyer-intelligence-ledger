name: CBI v6.4 one-shot WAL audit GREEN

on:
  push:
    branches:
      - cbi-v64-backup-wal-hardening-20260909

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install timezone data
        run: python -m pip install --disable-pip-version-check --no-input tzdata==2026.3
      - name: Configure git
        run: |
          git config user.name 'cbi-v64-task5'
          git config user.email 'actions@users.noreply.github.com'
      - name: Implement sanitized WAL audit core
        run: python scripts/cbi_v64_task5_wal_audit_green.py
      - name: Verify WAL audit GREEN before push
        run: |
          python -m unittest tests.test_v64_mutation_wal_audit -v
          python -m unittest tests.test_v64_request_scoped_verified_snapshot tests.test_v64_state_query_performance_protocol tests.test_v64_backup_object_store tests.test_v64_backup_retention_runtime tests.test_v64_backup_replica_server_wiring -v
          python -m unittest discover -s tests -p 'test_v61*.py'
          python tests/privacy_scan.py
          python -m compileall -q mcp unified_runtime
      - name: Commit implementation and remove temporary helpers
        run: |
          git add mcp/server_v61.py
          git commit -m 'feat(v64): add sanitized mutation WAL audit core'
          git rm .github/workflows/cbi-v64-task5-wal-audit-green.yml scripts/cbi_v64_task5_wal_audit_green.py
          git commit -m 'chore(v64): remove task5 WAL audit GREEN helpers'
      - name: Push verified result
        run: git push origin HEAD:cbi-v64-backup-wal-hardening-20260909
