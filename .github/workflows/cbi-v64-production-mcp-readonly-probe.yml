name: CBI v6.4 production MCP read-only probe

on:
  push:
    branches:
      - cbi-v64-c279-isolated-regression-4733a9b3

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCEPTANCE_BEARER: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
    steps:
      - name: Bind production durable tails by one-way commitments
        shell: python
        run: |
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("ACCEPTANCE_BEARER") or ""
          if not token:
              raise SystemExit("ACCEPTANCE_BEARER_PRESENT=false")
          base = "https://cbi-v61-preview.onrender.com"

          def health():
              with urllib.request.urlopen(
                  urllib.request.Request(
                      base + "/healthz",
                      headers={"Accept":"application/json","User-Agent":"cbi-v64-production-tail-commitment-probe"},
                      method="GET",
                  ),
                  timeout=45,
              ) as response:
                  return json.load(response)

          before = health()
          identity = dict(before.get("deployment_identity") or {})
          persistence_before = dict(before.get("object_store_persistence") or {})
          if before.get("status") != "ok":
              raise SystemExit("PRODUCTION_HEALTH_NOT_OK")
          if identity.get("git_sha") != "a311a2a57ee43a1f1a3b2819bf28946566b05692":
              raise SystemExit("PRODUCTION_SHA_DRIFT")
          if persistence_before.get("enabled") is not True:
              raise SystemExit("PRODUCTION_DURABLE_PERSISTENCE_REQUIRED")

          next_id = 1
          def rpc(method, params):
              global next_id
              request_id = next_id
              next_id += 1
              body = json.dumps({"jsonrpc":"2.0","id":request_id,"method":method,"params":params}, separators=(",", ":")).encode("utf-8")
              request = urllib.request.Request(
                  base + "/mcp", data=body, method="POST",
                  headers={
                      "Authorization":"Bearer " + token,
                      "Content-Type":"application/json",
                      "Accept":"application/json",
                      "MCP-Protocol-Version":"2026-07-28",
                      "User-Agent":"cbi-v64-production-tail-commitment-probe",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  print("PRODUCTION_MCP_HTTP_STATUS=" + str(exc.code))
                  raise SystemExit("PRODUCTION_MCP_AUTH_OR_PROTOCOL_REJECTED")
              if payload.get("jsonrpc") != "2.0" or payload.get("id") != request_id:
                  raise SystemExit("PRODUCTION_MCP_JSONRPC_INVALID")
              if isinstance(payload.get("error"), dict):
                  print("PRODUCTION_MCP_JSONRPC_ERROR_CODE=" + str(payload["error"].get("code")))
                  raise SystemExit("PRODUCTION_MCP_JSONRPC_REJECTED")
              result = payload.get("result")
              if not isinstance(result, dict):
                  raise SystemExit("PRODUCTION_MCP_RESULT_INVALID")
              return result

          def call_tool(name, arguments):
              result = rpc("tools/call", {"name":name,"arguments":arguments})
              structured = result.get("structuredContent")
              if not isinstance(structured, dict):
                  raise SystemExit("PRODUCTION_TOOL_STRUCTURED_CONTENT_MISSING:" + name)
              return structured

          rpc("initialize", {
              "protocolVersion":"2025-06-18","capabilities":{},
              "clientInfo":{"name":"cbi-v64-production-tail-commitment-probe","version":"1"},
          })
          queue = call_tool("get_portfolio_queue", {"include_non_active":True,"include_non_production":True,"limit":1000})
          rows = queue.get("queue")
          if not isinstance(rows, list):
              raise SystemExit("PORTFOLIO_QUEUE_ROWS_MISSING")

          commitments = []
          invalid = 0
          for row in rows:
              if not isinstance(row, dict):
                  invalid += 1
                  continue
              investigation_id = str(row.get("investigation_id") or "")
              seq = row.get("last_safe_seq")
              event_hash = str(row.get("last_safe_event_hash") or "")
              if not investigation_id or isinstance(seq, bool) or not isinstance(seq, int) or len(event_hash) != 64:
                  invalid += 1
                  continue
              canonical = f"{investigation_id}|{seq}|{event_hash}".encode("utf-8")
              commitments.append(hashlib.sha256(canonical).hexdigest())
          commitments.sort()

          after = health()
          persistence_after = dict(after.get("object_store_persistence") or {})
          if dict(after.get("deployment_identity") or {}).get("git_sha") != identity.get("git_sha"):
              raise SystemExit("PRODUCTION_SHA_CHANGED_DURING_PROBE")
          if persistence_before.get("generation") != persistence_after.get("generation"):
              raise SystemExit("PRODUCTION_GENERATION_CHANGED_DURING_PROBE")
          if persistence_before.get("recovery_fingerprint_sha256") != persistence_after.get("recovery_fingerprint_sha256"):
              raise SystemExit("PRODUCTION_RECOVERY_FINGERPRINT_CHANGED_DURING_PROBE")

          print("PRODUCTION_MCP_AUTH=PASS")
          print("PORTFOLIO_TOTAL_SCANNED=" + str(queue.get("total_scanned")))
          print("PORTFOLIO_RETURNED_ROWS=" + str(len(rows)))
          print("PORTFOLIO_VALID_TAIL_COMMITMENTS=" + str(len(commitments)))
          print("PORTFOLIO_INVALID_TAIL_ROWS=" + str(invalid))
          print("PORTFOLIO_TAIL_COMMITMENTS=" + json.dumps(commitments, separators=(",", ":")))
          print("OBJECT_GENERATION=" + str(persistence_after.get("generation")))
          print("RECOVERY_FINGERPRINT_STABLE=true")
          print("MUTATING_TOOL_CALLED=false")
          print("PRIVATE_RAW_VALUES_PRINTED=false")
          print("SECRET_VALUE_PRINTED=false")
