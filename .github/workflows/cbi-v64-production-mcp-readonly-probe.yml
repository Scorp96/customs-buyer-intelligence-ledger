name: CBI v6.4 production MCP read-only probe

on:
  push:
    branches:
      - cbi-v64-c279-isolated-regression-4733a9b3

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ACCEPTANCE_BEARER: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
    steps:
      - name: Verify committed C279 production semantics read-only
        shell: python
        run: |
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          TARGET = "4881a1e3ab093e48a22ef990c26a871445aaddf24074ab38300f863e62d09165"
          token = os.environ.get("ACCEPTANCE_BEARER") or ""
          if not token:
              raise SystemExit("ACCEPTANCE_BEARER_PRESENT=false")
          base = "https://cbi-v61-preview.onrender.com"

          def health():
              with urllib.request.urlopen(
                  urllib.request.Request(
                      base + "/healthz",
                      headers={"Accept":"application/json","User-Agent":"cbi-v64-production-c279-semantic-probe"},
                      method="GET",
                  ), timeout=45,
              ) as response:
                  return json.load(response)

          before = health()
          identity = dict(before.get("deployment_identity") or {})
          persist_before = dict(before.get("object_store_persistence") or {})
          if before.get("status") != "ok" or identity.get("git_sha") != "a311a2a57ee43a1f1a3b2819bf28946566b05692":
              raise SystemExit("PRODUCTION_HEALTH_OR_SHA_PIN_FAILED")

          next_id = 1
          def rpc(method, params):
              global next_id
              rid = next_id
              next_id += 1
              body = json.dumps({"jsonrpc":"2.0","id":rid,"method":method,"params":params}, separators=(",", ":")).encode()
              request = urllib.request.Request(
                  base + "/mcp", data=body, method="POST",
                  headers={
                      "Authorization":"Bearer " + token,
                      "Content-Type":"application/json",
                      "Accept":"application/json",
                      "MCP-Protocol-Version":"2026-07-28",
                      "User-Agent":"cbi-v64-production-c279-semantic-probe",
                  },
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  payload = json.load(response)
              if payload.get("jsonrpc") != "2.0" or payload.get("id") != rid or isinstance(payload.get("error"), dict):
                  raise SystemExit("PRODUCTION_MCP_JSONRPC_REJECTED")
              result = payload.get("result")
              if not isinstance(result, dict):
                  raise SystemExit("PRODUCTION_MCP_RESULT_INVALID")
              return result

          def call(name, arguments):
              result = rpc("tools/call", {"name":name,"arguments":arguments})
              data = result.get("structuredContent")
              if not isinstance(data, dict):
                  raise SystemExit("STRUCTURED_CONTENT_MISSING:" + name)
              return data

          def commitment(row):
              if not isinstance(row, dict):
                  return ""
              inv = str(row.get("investigation_id") or "")
              seq = row.get("last_safe_seq")
              event_hash = str(row.get("last_safe_event_hash") or "")
              if not inv or isinstance(seq, bool) or not isinstance(seq, int) or len(event_hash) != 64:
                  return ""
              return hashlib.sha256(f"{inv}|{seq}|{event_hash}".encode()).hexdigest()

          def shape(value, depth=0):
              if depth >= 5:
                  return type(value).__name__
              if isinstance(value, dict):
                  return {str(k):shape(v, depth+1) for k,v in sorted(value.items())}
              if isinstance(value, list):
                  return {"type":"list","count":len(value),"sample_shape":shape(value[0], depth+1) if value else None}
              return type(value).__name__

          rpc("initialize", {"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"cbi-v64-production-c279-semantic-probe","version":"1"}})
          queue = call("get_portfolio_queue", {"include_non_active":True,"include_non_production":True,"limit":1000})
          rows = queue.get("queue") if isinstance(queue.get("queue"), list) else []
          matches = [row for row in rows if commitment(row) == TARGET]
          if len(matches) != 1:
              print("C279_COMMITMENT_MATCH_COUNT=" + str(len(matches)))
              raise SystemExit("C279_COMMITMENT_NOT_UNIQUE")
          target = matches[0]
          inv = str(target["investigation_id"])

          state = call("get_investigation_state", {"investigation_id":inv})
          claims = call("get_claims", {"investigation_id":inv})
          history = call("get_information_history", {"investigation_id":inv,"limit":1000})
          readiness = call("evaluate_outreach_readiness", {"investigation_id":inv})

          route_view = readiness.get("canonical_route_view")
          blockers = readiness.get("block_reasons")
          valid_obs = readiness.get("valid_company_route_observation_ids")
          valid_info = readiness.get("valid_information_route_ids")
          readiness_state = str(readiness.get("outreach_readiness") or readiness.get("readiness") or "")

          after = health()
          persist_after = dict(after.get("object_store_persistence") or {})
          if dict(after.get("deployment_identity") or {}).get("git_sha") != identity.get("git_sha"):
              raise SystemExit("PRODUCTION_SHA_CHANGED_DURING_PROBE")
          if persist_after.get("generation") != persist_before.get("generation"):
              raise SystemExit("PRODUCTION_GENERATION_CHANGED_DURING_PROBE")
          if persist_after.get("recovery_fingerprint_sha256") != persist_before.get("recovery_fingerprint_sha256"):
              raise SystemExit("PRODUCTION_RECOVERY_FINGERPRINT_CHANGED_DURING_PROBE")

          print("C279_COMMITMENT_MATCH_COUNT=1")
          print("C279_STATE_STRUCTURAL_SHAPE=" + json.dumps(shape(state), sort_keys=True, separators=(",", ":")))
          print("C279_CLAIMS_STRUCTURAL_SHAPE=" + json.dumps(shape(claims), sort_keys=True, separators=(",", ":")))
          print("C279_INFORMATION_HISTORY_STRUCTURAL_SHAPE=" + json.dumps(shape(history), sort_keys=True, separators=(",", ":")))
          print("C279_OUTREACH_READINESS=" + readiness_state)
          print("C279_BLOCK_REASONS=" + json.dumps(sorted(str(x) for x in blockers) if isinstance(blockers, list) else [], separators=(",", ":")))
          print("C279_CANONICAL_ROUTE_COUNT=" + str(len(route_view) if isinstance(route_view, list) else 0))
          print("C279_VALID_COMPANY_ROUTE_OBSERVATION_COUNT=" + str(len(valid_obs) if isinstance(valid_obs, list) else 0))
          print("C279_VALID_INFORMATION_ROUTE_COUNT=" + str(len(valid_info) if isinstance(valid_info, list) else 0))
          print("OBJECT_GENERATION=" + str(persist_after.get("generation")))
          print("RECOVERY_FINGERPRINT_STABLE=true")
          print("MUTATING_TOOL_CALLED=false")
          print("PRIVATE_RAW_VALUES_PRINTED=false")
          print("SECRET_VALUE_PRINTED=false")
