name: CBI v6.4 production MCP read-only probe

on:
  push:
    branches:
      - cbi-v64-c279-isolated-regression-4733a9b3

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCEPTANCE_BEARER: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
    steps:
      - name: Probe production MCP with existing acceptance bearer
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("ACCEPTANCE_BEARER") or ""
          if not token:
              raise SystemExit("ACCEPTANCE_BEARER_PRESENT=false")
          base = "https://cbi-v61-preview.onrender.com"

          def health():
              with urllib.request.urlopen(
                  urllib.request.Request(
                      base + "/healthz",
                      headers={"Accept": "application/json", "User-Agent": "cbi-v64-production-mcp-readonly-probe"},
                      method="GET",
                  ),
                  timeout=30,
              ) as response:
                  return json.load(response)

          before = health()
          identity = dict(before.get("deployment_identity") or {})
          if before.get("status") != "ok":
              raise SystemExit("PRODUCTION_HEALTH_NOT_OK")
          if identity.get("git_sha") != "a311a2a57ee43a1f1a3b2819bf28946566b05692":
              raise SystemExit("PRODUCTION_SHA_DRIFT")
          before_persistence = dict(before.get("object_store_persistence") or {})
          print("PRODUCTION_HEALTH_PIN=PASS")

          next_id = 1
          def rpc(method, params):
              global next_id
              request_id = next_id
              next_id += 1
              body = json.dumps({"jsonrpc":"2.0","id":request_id,"method":method,"params":params}, separators=(",", ":")).encode("utf-8")
              request = urllib.request.Request(
                  base + "/mcp", data=body, method="POST",
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "MCP-Protocol-Version": "2026-07-28",
                      "User-Agent": "cbi-v64-production-mcp-readonly-probe",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  print("PRODUCTION_MCP_HTTP_STATUS=" + str(exc.code))
                  raise SystemExit("PRODUCTION_MCP_AUTH_OR_PROTOCOL_REJECTED")
              if payload.get("jsonrpc") != "2.0" or payload.get("id") != request_id:
                  raise SystemExit("PRODUCTION_MCP_JSONRPC_INVALID")
              if isinstance(payload.get("error"), dict):
                  print("PRODUCTION_MCP_JSONRPC_ERROR_CODE=" + str(payload["error"].get("code")))
                  raise SystemExit("PRODUCTION_MCP_JSONRPC_REJECTED")
              result = payload.get("result")
              if not isinstance(result, dict):
                  raise SystemExit("PRODUCTION_MCP_RESULT_INVALID")
              return result

          def call_tool(name, arguments):
              result = rpc("tools/call", {"name": name, "arguments": arguments})
              structured = result.get("structuredContent")
              if not isinstance(structured, dict):
                  raise SystemExit("PRODUCTION_TOOL_STRUCTURED_CONTENT_MISSING:" + name)
              return structured

          def shape(value, depth=0):
              if depth >= 4:
                  return type(value).__name__
              if isinstance(value, dict):
                  return {str(k): shape(v, depth + 1) for k, v in sorted(value.items())}
              if isinstance(value, list):
                  sample = value[:1]
                  return {"type":"list","count":len(value),"sample_shape":shape(sample[0], depth + 1) if sample else None}
              return type(value).__name__

          rpc("initialize", {
              "protocolVersion":"2025-06-18",
              "capabilities":{},
              "clientInfo":{"name":"cbi-v64-production-mcp-readonly-probe","version":"3"},
          })
          listed = rpc("tools/list", {})
          tools = listed.get("tools")
          if not isinstance(tools, list):
              raise SystemExit("PRODUCTION_MCP_TOOLS_LIST_MISSING")
          names = sorted(str(item.get("name") or "") for item in tools if isinstance(item, dict) and item.get("name"))
          print("PRODUCTION_MCP_AUTH=PASS")
          print("PRODUCTION_MCP_TOOL_COUNT=" + str(len(names)))

          queue = call_tool("get_portfolio_queue", {"include_non_active": True, "include_non_production": True, "limit": 1000})
          print("PORTFOLIO_QUEUE_STRUCTURAL_SHAPE=" + json.dumps(shape(queue), sort_keys=True, separators=(",", ":")))

          after = health()
          after_identity = dict(after.get("deployment_identity") or {})
          after_persistence = dict(after.get("object_store_persistence") or {})
          if after_identity.get("git_sha") != identity.get("git_sha"):
              raise SystemExit("PRODUCTION_SHA_CHANGED_DURING_PROBE")
          print("PORTFOLIO_QUEUE_READONLY_CALL=PASS")
          print("OBJECT_GENERATION_BEFORE=" + str(before_persistence.get("generation")))
          print("OBJECT_GENERATION_AFTER=" + str(after_persistence.get("generation")))
          print("RECOVERY_FINGERPRINT_SAME=" + str(before_persistence.get("recovery_fingerprint_sha256") == after_persistence.get("recovery_fingerprint_sha256")).lower())
          print("MUTATING_TOOL_CALLED=false")
          print("PRIVATE_FIELD_VALUES_PRINTED=false")
          print("SECRET_VALUE_PRINTED=false")
