name: CBI v6 independent CI

on:
  push:
    branches:
      - cbi-v6-20260828
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cbi-v6-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: regression (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate JSON manifests
        run: >-
          python -c "import json, pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8-sig')) for p in ['.codex-plugin/plugin.json','.mcp.json','skills/investigate-customs-buyers/references/buyer-intelligence-schema.json','skills/investigate-customs-buyers/references/enrichment-schema.json','skills/investigate-customs-buyers/references/evidence-bundle-schema.json','skills/investigate-customs-buyers/references/intelligence-rules.json','skills/investigate-customs-buyers/references/runtime-policy.json','skills/investigate-customs-buyers/references/unified-runtime-schema.json']]; print('JSON manifests: PASS')"

      - name: Install YAML parser in ephemeral CI only
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Validate agent YAML
        run: >-
          python -c "import pathlib, yaml; p=pathlib.Path('skills/investigate-customs-buyers/agents/openai.yaml'); data=yaml.safe_load(p.read_text(encoding='utf-8-sig')); assert isinstance(data, dict); print('Agent YAML: PASS')"

      - name: Run unittest regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run 100-Evidence structural smoke acceptance
        run: python scripts/run_v6_load_acceptance.py --profile smoke

      - name: Run MCP compatibility self-test
        run: python mcp/self_test.py

      - name: Run MCP v6 protocol test
        run: python mcp/v6_protocol_test.py

      - name: Run MCP v6.1 production-adapter protocol test
        run: python mcp/v61_hardening_protocol_test.py

      - name: Run privacy scan
        run: python tests/privacy_scan.py

      - name: Run compatibility parser self-test
        run: python skills/investigate-customs-buyers/scripts/self_test.py

      - name: Run intelligence self-test
        run: python skills/investigate-customs-buyers/scripts/intelligence_self_test.py

      - name: Run outreach self-test
        run: python skills/investigate-customs-buyers/scripts/outreach_self_test.py

      - name: Run strategic self-test
        run: python skills/investigate-customs-buyers/scripts/strategic_self_test.py

      - name: Run v3 compatibility self-test
        run: python skills/investigate-customs-buyers/scripts/v3_self_test.py
