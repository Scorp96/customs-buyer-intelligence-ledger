name: CBI v6.4 C279 export diagnostic

on:
  push:
    branches:
      - cbi-v64-c279-production-export-diagnostic-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cbi-v64-c279-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned CFFI runtime dependency
        run: python -m pip install --disable-pip-version-check --no-input --only-binary=:all: cffi==2.0.0 pycparser==2.22

      - name: Install hash-pinned diagnostic crypto wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .c279-wheel
          mkdir .c279-wheel
          python -m pip download --disable-pip-version-check --no-input --only-binary=:all: --no-deps cryptography==50.0.1 --dest .c279-wheel
          test "$(find .c279-wheel -maxdepth 1 -type f | wc -l)" -eq 1
          wheel="$(find .c279-wheel -maxdepth 1 -type f -name 'cryptography-50.0.1-*.whl')"
          test -n "$wheel"
          actual="$(sha256sum "$wheel" | awk '{print $1}')"
          case "$actual" in
            51afcfceb15597cf2635068e4ac9a56b2abde622edde17f37d85fd7b5306497a|51593d180cf6d179bde5c5d065bed81386b1f381656ae7d042b7ffc87a9895ad|ff838d62ec1bfce4f9ba7fa16f4a7b554cd8d0c299e6be37502161a660c84eef) ;;
            *) echo "unexpected cryptography wheel sha256: $actual" >&2; exit 1 ;;
          esac
          python -m pip install --disable-pip-version-check --no-input --no-deps "$wheel"
          python -c "from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey; from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305; print('diagnostic crypto: PASS')"

      - name: Run C279 export diagnostic contract
        run: python -m unittest -v tests.test_v64_c279_export_diagnostic

      - name: Run existing object-store recovery regression
        run: python -m unittest -v tests.test_v63_object_store_recovery_state

      - name: Run existing OAuth transport regression
        run: python -m unittest -v tests.test_chatgpt_oauth_transport

      - name: Run privacy scan
        run: python tests/privacy_scan.py
