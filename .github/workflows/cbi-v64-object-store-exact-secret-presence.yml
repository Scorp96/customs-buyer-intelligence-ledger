name: CBI v6.4 exact object-store secret presence probe

on:
  push:
    branches:
      - cbi-v64-c279-isolated-regression-4733a9b3

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CBI_OBJECT_STORE_MODE_VALUE: ${{ secrets.CBI_OBJECT_STORE_MODE }}
      CBI_OBJECT_STORE_ENDPOINT_VALUE: ${{ secrets.CBI_OBJECT_STORE_ENDPOINT }}
      CBI_OBJECT_STORE_BUCKET_VALUE: ${{ secrets.CBI_OBJECT_STORE_BUCKET }}
      CBI_OBJECT_STORE_ACCESS_KEY_ID_VALUE: ${{ secrets.CBI_OBJECT_STORE_ACCESS_KEY_ID }}
      CBI_OBJECT_STORE_SECRET_ACCESS_KEY_VALUE: ${{ secrets.CBI_OBJECT_STORE_SECRET_ACCESS_KEY }}
      CBI_OBJECT_STORE_REGION_VALUE: ${{ secrets.CBI_OBJECT_STORE_REGION }}
      CBI_OBJECT_STORE_PREFIX_VALUE: ${{ secrets.CBI_OBJECT_STORE_PREFIX }}
      CBI_OBJECT_STORE_RETENTION_VALUE: ${{ secrets.CBI_OBJECT_STORE_RETENTION }}
    steps:
      - name: Report presence only
        shell: python
        run: |
          import os
          names = [
              "CBI_OBJECT_STORE_MODE",
              "CBI_OBJECT_STORE_ENDPOINT",
              "CBI_OBJECT_STORE_BUCKET",
              "CBI_OBJECT_STORE_ACCESS_KEY_ID",
              "CBI_OBJECT_STORE_SECRET_ACCESS_KEY",
              "CBI_OBJECT_STORE_REGION",
              "CBI_OBJECT_STORE_PREFIX",
              "CBI_OBJECT_STORE_RETENTION",
          ]
          for name in names:
              present = bool(os.environ.get(name + "_VALUE", ""))
              print(f"{name}={'PRESENT' if present else 'ABSENT'}")
          print("SECRET_VALUES_PRINTED=false")
          print("NETWORK_CALLS_PERFORMED=false")
