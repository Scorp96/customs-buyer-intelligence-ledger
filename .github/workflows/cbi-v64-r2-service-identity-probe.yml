name: CBI v6.4 R2 service identity probe

on:
  push:
    branches:
      - cbi-v64-c279-current-prod-gate-20260909
    paths:
      - .github/workflows/cbi-v64-r2-service-identity-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare value-free health identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request

          urls = {
              "production": "https://cbi-v61-preview.onrender.com/healthz",
              "acceptance": "https://cbi-v63-r2-acceptance-20260903-r01.onrender.com/healthz",
          }
          out = {}
          for name, url in urls.items():
              with urllib.request.urlopen(url, timeout=60) as response:
                  value = json.load(response)
              identity = value.get("deployment_identity") if isinstance(value.get("deployment_identity"), dict) else {}
              persistence = value.get("object_store_persistence") if isinstance(value.get("object_store_persistence"), dict) else {}
              out[name] = {
                  "status": value.get("status"),
                  "git_sha": identity.get("git_sha"),
                  "object_store_mode": identity.get("object_store_mode"),
                  "object_state_generation": identity.get("object_state_generation"),
                  "restore_generation": identity.get("restore_generation"),
                  "recovery_fingerprint_sha256": persistence.get("recovery_fingerprint_sha256"),
                  "durable_root_bound": value.get("durable_root_bound"),
              }
          same_state = (
              out["production"]["object_state_generation"] == out["acceptance"]["object_state_generation"]
              and out["production"]["restore_generation"] == out["acceptance"]["restore_generation"]
              and out["production"]["recovery_fingerprint_sha256"] == out["acceptance"]["recovery_fingerprint_sha256"]
          )
          print(json.dumps({"schema":"cbi.v64-r2-service-identity-probe.v1","same_state":same_state,"services":out}, sort_keys=True))
          PY
