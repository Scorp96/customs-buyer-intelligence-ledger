name: CBI v6.4 C279 current-cloud preflight

on:
  push:
    branches:
      - cbi-v64-c279-health-probe-a311a2a
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cbi-v64-c279-current-cloud-preflight
  cancel-in-progress: false

env:
  CBI_V64_PRODUCTION_SHA: a311a2a57ee43a1f1a3b2819bf28946566b05692
  CBI_V64_C279_INVESTIGATION_ID: INV-20260902T093152Z-5f3526759f65
  CBI_V64_C279_EXPECTED_SEQ: '27'
  CBI_V64_C279_EXPECTED_HASH: cf5d92ecf7f7d4842306cc39134bdd09aced5fd087179da1ab6b0da5ca19b498

jobs:
  preflight:
    name: C279 current-cloud read-only preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pin current production deployment and R2 generation
        shell: python
        run: |
          import json, os, urllib.request
          from pathlib import Path
          req = urllib.request.Request(
              "https://cbi-v61-preview.onrender.com/healthz",
              headers={"Accept":"application/json","User-Agent":"cbi-v64-c279-current-cloud-preflight"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))
          ident = dict(payload.get("deployment_identity") or {})
          persistence = dict(payload.get("object_store_persistence") or {})
          safe = {
              "status":payload.get("status"),
              "git_sha":ident.get("git_sha"),
              "object_store_mode":ident.get("object_store_mode"),
              "object_state_schema":ident.get("object_state_schema"),
              "object_state_generation":ident.get("object_state_generation"),
              "restore_generation":ident.get("restore_generation"),
              "archive_format":persistence.get("archive_format"),
              "generation":persistence.get("generation"),
              "recovery_fingerprint_sha256":persistence.get("recovery_fingerprint_sha256"),
              "prefix":persistence.get("prefix"),
          }
          if safe["status"] not in {"ok","degraded"}: raise SystemExit("C279_PRODUCTION_HEALTH_NOT_LIVE")
          if safe["git_sha"] != os.environ["CBI_V64_PRODUCTION_SHA"]: raise SystemExit("C279_PRODUCTION_SHA_DRIFT")
          if safe["object_store_mode"] != "r2": raise SystemExit("C279_PRODUCTION_NOT_R2_BACKED")
          if safe["object_state_schema"] != "cbi.object-store-state.v2" or safe["archive_format"] != "object_state_v2": raise SystemExit("C279_PRODUCTION_OBJECT_STATE_SCHEMA_DRIFT")
          if safe["generation"] != safe["object_state_generation"] or safe["restore_generation"] != safe["generation"]: raise SystemExit("C279_PRODUCTION_GENERATION_LINEAGE_DRIFT")
          if safe["prefix"] != "cbi-v61": raise SystemExit("C279_PRODUCTION_PREFIX_DRIFT")
          fingerprint = str(safe["recovery_fingerprint_sha256"] or "").lower()
          if len(fingerprint) != 64 or any(ch not in "0123456789abcdef" for ch in fingerprint): raise SystemExit("C279_PRODUCTION_RECOVERY_FINGERPRINT_INVALID")
          Path(os.environ["RUNNER_TEMP"]).joinpath("c279-current-cloud.json").write_text(json.dumps(safe, sort_keys=True), encoding="utf-8")
          print("C279_CURRENT_CLOUD_IDENTITY=" + json.dumps(safe, sort_keys=True, separators=(",",":")))

      - name: Verify Runtime/WAL and exact C279 durable tail through read-only MCP only
        shell: python
        env:
          CBI_READONLY_BEARER: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
        run: |
          import json, os, urllib.error, urllib.request
          from pathlib import Path
          token = os.environ.get("CBI_READONLY_BEARER", "")
          if len(token) < 32: raise SystemExit("C279_READONLY_BEARER_UNAVAILABLE")
          request_id = 0
          def call(name, arguments):
              global request_id
              request_id += 1
              body = json.dumps({"jsonrpc":"2.0","id":request_id,"method":"tools/call","params":{"name":name,"arguments":arguments}}, separators=(",",":")).encode("utf-8")
              req = urllib.request.Request(
                  "https://cbi-v61-preview.onrender.com/mcp", data=body, method="POST",
                  headers={"Authorization":"Bearer " + token,"Content-Type":"application/json","Accept":"application/json","MCP-Protocol-Version":"2026-07-28","User-Agent":"cbi-v64-c279-current-cloud-preflight"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"C279_READONLY_MCP_HTTP_{exc.code}")
              if payload.get("id") != request_id or payload.get("error"): raise SystemExit("C279_READONLY_MCP_RPC_FAILURE")
              structured = ((payload.get("result") or {}).get("structuredContent"))
              if not isinstance(structured, dict): raise SystemExit("C279_READONLY_MCP_STRUCTURED_CONTENT_MISSING")
              return structured
          health = call("get_runtime_health", {})
          if health.get("status") != "READY": raise SystemExit("C279_RUNTIME_NOT_READY")
          wal = dict(health.get("mutation_wal") or {})
          if wal.get("prepared_count") != 0 or wal.get("invalid_count") != 0 or wal.get("reconciliation_required") is not False: raise SystemExit("C279_MUTATION_WAL_NOT_CLEAN")
          inv = os.environ["CBI_V64_C279_INVESTIGATION_ID"]
          state = call("get_investigation_state", {"investigation_id":inv})
          if state.get("last_safe_seq") != int(os.environ["CBI_V64_C279_EXPECTED_SEQ"]): raise SystemExit("C279_DURABLE_TAIL_SEQ_DRIFT")
          if state.get("last_safe_event_hash") != os.environ["CBI_V64_C279_EXPECTED_HASH"]: raise SystemExit("C279_DURABLE_TAIL_HASH_DRIFT")
          safe = {
              "runtime_status":health.get("status"),"runtime_version":health.get("runtime_version"),"checked_sessions":health.get("checked_sessions"),
              "wal_prepared":wal.get("prepared_count"),"wal_invalid":wal.get("invalid_count"),"wal_reconciliation_required":wal.get("reconciliation_required"),
              "c279_last_safe_seq":state.get("last_safe_seq"),"c279_last_safe_event_hash":state.get("last_safe_event_hash"),
          }
          Path(os.environ["RUNNER_TEMP"]).joinpath("c279-runtime.json").write_text(json.dumps(safe, sort_keys=True), encoding="utf-8")
          print("C279_RUNTIME_AND_TAIL=" + json.dumps(safe, sort_keys=True, separators=(",",":")))

      - name: Reproduce current C279 pre-patch route/readiness defect read-only
        shell: python
        env:
          CBI_READONLY_BEARER: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
        run: |
          import json, os, urllib.request
          from pathlib import Path
          token = os.environ.get("CBI_READONLY_BEARER", "")
          inv = os.environ["CBI_V64_C279_INVESTIGATION_ID"]
          request_id = 100
          def call(name, arguments):
              global request_id
              request_id += 1
              body = json.dumps({"jsonrpc":"2.0","id":request_id,"method":"tools/call","params":{"name":name,"arguments":arguments}}, separators=(",",":")).encode("utf-8")
              req = urllib.request.Request(
                  "https://cbi-v61-preview.onrender.com/mcp", data=body, method="POST",
                  headers={"Authorization":"Bearer " + token,"Content-Type":"application/json","Accept":"application/json","MCP-Protocol-Version":"2026-07-28","User-Agent":"cbi-v64-c279-current-cloud-preflight"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if payload.get("error"): raise SystemExit("C279_READONLY_SEMANTIC_RPC_FAILURE")
              structured = ((payload.get("result") or {}).get("structuredContent"))
              if not isinstance(structured, dict): raise SystemExit("C279_READONLY_SEMANTIC_CONTENT_MISSING")
              return structured
          claims = call("get_claims", {"investigation_id":inv})
          account = call("get_account_state", {"investigation_id":inv})
          readiness = call("evaluate_outreach_readiness", {"investigation_id":inv})
          history = call("get_information_history", {"investigation_id":inv,"related_account_id":"C279"})
          claims_text = json.dumps(claims, sort_keys=True)
          readiness_text = json.dumps(readiness, sort_keys=True)
          if "contact.company_route" not in claims_text or "SUPPORTED" not in claims_text: raise SystemExit("C279_COMPANY_ROUTE_SUPPORTED_MARKER_MISSING")
          if readiness.get("readiness") != "IDENTITY_ONLY" or readiness.get("outreach_readiness") != "IDENTITY_ONLY": raise SystemExit("C279_PREPATCH_READINESS_STATE_DRIFT")
          if readiness.get("canonical_route_view") not in ([], None): raise SystemExit("C279_CANONICAL_ROUTE_VIEW_NO_LONGER_EMPTY")
          if readiness.get("valid_company_route_observation_ids") not in ([], None): raise SystemExit("C279_VALID_COMPANY_ROUTE_IDS_NO_LONGER_EMPTY")
          if (account.get("routes") or []) != []: raise SystemExit("C279_ACCOUNT_ROUTES_NO_LONGER_EMPTY")
          summary = dict(history.get("summary") or {})
          if summary.get("effective_outreach_routes") != 0: raise SystemExit("C279_EFFECTIVE_OUTREACH_ROUTES_NO_LONGER_ZERO")
          if "VERIFIED_ACCOUNT_OWNED_ROUTE_REQUIRED" not in readiness_text: raise SystemExit("C279_EXPECTED_ROUTE_BLOCKER_MISSING")
          safe = {
              "company_route_supported":True,"readiness":readiness.get("readiness"),"outreach_readiness":readiness.get("outreach_readiness"),
              "canonical_route_count":len(readiness.get("canonical_route_view") or []),"valid_company_route_id_count":len(readiness.get("valid_company_route_observation_ids") or []),
              "account_route_count":len(account.get("routes") or []),"effective_outreach_routes":summary.get("effective_outreach_routes"),"expected_blocker_present":True,
          }
          Path(os.environ["RUNNER_TEMP"]).joinpath("c279-prepatch.json").write_text(json.dumps(safe, sort_keys=True), encoding="utf-8")
          print("C279_PREPATCH_DEFECT=" + json.dumps(safe, sort_keys=True, separators=(",",":")))

      - name: Prove current live MCP has no raw session/export surface
        shell: python
        env:
          CBI_READONLY_BEARER: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
        run: |
          import json, os, urllib.request
          from pathlib import Path
          token = os.environ.get("CBI_READONLY_BEARER", "")
          body = json.dumps({"jsonrpc":"2.0","id":900,"method":"tools/list","params":{}}, separators=(",",":")).encode("utf-8")
          req = urllib.request.Request(
              "https://cbi-v61-preview.onrender.com/mcp", data=body, method="POST",
              headers={"Authorization":"Bearer " + token,"Content-Type":"application/json","Accept":"application/json","MCP-Protocol-Version":"2026-07-28","User-Agent":"cbi-v64-c279-current-cloud-preflight"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))
          names = sorted(str(row.get("name") or "") for row in ((payload.get("result") or {}).get("tools") or []) if row.get("name"))
          exportish = [name for name in names if any(fragment in name.lower() for fragment in ("session","event","export","snapshot","backup","raw"))]
          if exportish: raise SystemExit("C279_RAW_EXPORT_SURFACE_APPEARED:" + ",".join(exportish))
          safe = {"tool_count":len(names),"raw_export_surface":False}
          Path(os.environ["RUNNER_TEMP"]).joinpath("c279-surface.json").write_text(json.dumps(safe, sort_keys=True), encoding="utf-8")
          print("C279_LIVE_MCP_SURFACE=" + json.dumps(safe, sort_keys=True, separators=(",",":")))

      - name: Confirm production R2 object bytes are unavailable unsigned
        shell: python
        run: |
          import json, urllib.error, urllib.request
          from pathlib import Path
          import os
          url = "https://650e0986f2379c42507d3fc5ebb597a4.r2.cloudflarestorage.com/cbi-v61-production/cbi-v61/current.json"
          statuses = {}
          for method in ("HEAD","GET"):
              req = urllib.request.Request(url, method=method, headers={"User-Agent":"cbi-v64-c279-current-cloud-preflight"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      status = int(response.status)
                      if method == "GET": response.read(1)
              except urllib.error.HTTPError as exc:
                  status = int(exc.code)
              if status == 200: raise SystemExit("C279_PRODUCTION_R2_UNEXPECTEDLY_PUBLIC")
              if status not in {400,401,403,404,405}: raise SystemExit(f"C279_PRODUCTION_R2_UNEXPECTED_HTTP_{method}_{status}")
              statuses[method] = status
          Path(os.environ["RUNNER_TEMP"]).joinpath("c279-r2-access.json").write_text(json.dumps(statuses, sort_keys=True), encoding="utf-8")
          print("C279_UNSIGNED_R2_ACCESS=" + json.dumps(statuses, sort_keys=True, separators=(",",":")))

      - name: Emit fail-closed current-cloud preflight report
        shell: python
        run: |
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          health = json.loads((root / "c279-current-cloud.json").read_text(encoding="utf-8"))
          runtime = json.loads((root / "c279-runtime.json").read_text(encoding="utf-8"))
          prepatch = json.loads((root / "c279-prepatch.json").read_text(encoding="utf-8"))
          surface = json.loads((root / "c279-surface.json").read_text(encoding="utf-8"))
          r2 = json.loads((root / "c279-r2-access.json").read_text(encoding="utf-8"))
          report = {
              "schema":"cbi.v64-c279-current-cloud-preflight.v1","result":"BLOCKED_EXTERNAL","blocker":"AUTHORITATIVE_SOURCE_RUNTIME_ROOT_UNAVAILABLE",
              "c279_full_runtime_regression_verified":False,"production_mutated":False,"production_sha":health["git_sha"],
              "object_state_generation":health["generation"],"recovery_fingerprint_sha256":health["recovery_fingerprint_sha256"],
              "runtime":runtime,"prepatch_semantics":prepatch,"live_mcp_surface":surface,"unsigned_r2_http":r2,
              "required_next_input":"authoritative current-cloud runtime-root bytes or an authorized read-only export path",
          }
          out = root / "CBI_V64_C279_CURRENT_CLOUD_PREFLIGHT.json"
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("C279_CURRENT_CLOUD_PREFLIGHT_RESULT=BLOCKED_EXTERNAL")
          print("C279_CURRENT_CLOUD_PREFLIGHT_BLOCKER=AUTHORITATIVE_SOURCE_RUNTIME_ROOT_UNAVAILABLE")

      - name: Upload sanitized C279 preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cbi-v64-c279-current-cloud-preflight-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/CBI_V64_C279_CURRENT_CLOUD_PREFLIGHT.json

      - name: Assert production ref remains unchanged
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote https://github.com/Scorp96/customs-buyer-intelligence-ledger refs/heads/cbi-v6-cloud-runtime-20260901 | cut -f1)"
          test "$remote" = "$CBI_V64_PRODUCTION_SHA"
          echo "C279_PRODUCTION_REF_UNCHANGED=$remote"
