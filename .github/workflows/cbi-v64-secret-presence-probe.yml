name: CBI v6.4 secret presence probe

on:
  push:
    branches:
      - cbi-v64-c279-isolated-regression-4733a9b3

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_R2_ACCESS: ${{ secrets.CBI_OBJECT_STORE_ACCESS_KEY_ID }}
      PROD_R2_SECRET: ${{ secrets.CBI_OBJECT_STORE_SECRET_ACCESS_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
      RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
      C279_BRIDGE: ${{ secrets.CBI_V64_C279_BRIDGE_EVIDENCE }}
      RENDER_SSH_PRIVATE_KEY: ${{ secrets.RENDER_SSH_PRIVATE_KEY }}
      CBI_RENDER_SSH_PRIVATE_KEY: ${{ secrets.CBI_RENDER_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      RENDER_SSH_KEY: ${{ secrets.RENDER_SSH_KEY }}
      CBI_SSH_PRIVATE_KEY: ${{ secrets.CBI_SSH_PRIVATE_KEY }}
    steps:
      - name: Report presence only
        shell: python
        run: |
          import os
          names = [
              "PROD_R2_ACCESS",
              "PROD_R2_SECRET",
              "RENDER_API_KEY",
              "RENDER_API_TOKEN",
              "RENDER_TOKEN",
              "C279_BRIDGE",
              "RENDER_SSH_PRIVATE_KEY",
              "CBI_RENDER_SSH_PRIVATE_KEY",
              "SSH_PRIVATE_KEY",
              "RENDER_SSH_KEY",
              "CBI_SSH_PRIVATE_KEY",
          ]
          for name in names:
              print(f"{name}={'PRESENT' if bool(os.environ.get(name)) else 'ABSENT'}")
          print("SECRET_VALUES_PRINTED=false")
