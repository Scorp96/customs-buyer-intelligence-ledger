name: CBI v6.4 minimal C279 diagnostic rebuild

on:
  push:
    branches:
      - cbi-v64-c279-protected-diagnostic-minimal-20260909

permissions:
  contents: write

jobs:
  rebuild:
    if: "${{ github.event.head_commit.message == 'chore(v64): stage line-ending-preserving C279 diagnostic rebuild' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild semantic-equivalent diagnostic overlay without newline churn
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source_sha = "35a1bda8d6da0b3f26c888f44a44e0f7ad21e0d1"
          paths = [
              "mcp/c279_single_session_export_v64.py",
              "mcp/chatgpt_oauth_transport.py",
              "mcp/remote_transport.py",
              "mcp/server_v61_remote.py",
              "tests/test_v64_c279_export_entrypoint_contract.py",
              "tests/test_v64_c279_export_operator_intent.py",
              "tests/test_v64_c279_export_transport.py",
              "tests/test_v64_c279_single_session_export.py",
              "tests/test_v64_c279_transport_main_forwarding.py",
          ]

          def normalize_lf(data: bytes) -> bytes:
              return data.replace(b"\r\n", b"\n").replace(b"\r", b"\n")

          for raw in paths:
              path = Path(raw)
              target = subprocess.check_output(["git", "show", f"{source_sha}:{raw}"])
              normalized = normalize_lf(target)
              if path.exists():
                  base = path.read_bytes()
                  crlf = base.count(b"\r\n")
                  lone_lf = base.count(b"\n") - crlf
                  if crlf > lone_lf:
                      normalized = normalized.replace(b"\n", b"\r\n")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(normalized)

          Path(".github/workflows/cbi-v64-c279-minimal-rebuild.yml").unlink()
          PY
          git diff --check
      - name: Run diagnostic focused contracts before commit
        run: >-
          python -m unittest -v
          tests.test_v64_c279_single_session_export
          tests.test_v64_c279_export_transport
          tests.test_v64_c279_export_entrypoint_contract
          tests.test_v64_c279_transport_main_forwarding
          tests.test_v64_c279_export_operator_intent
      - name: Run privacy scan
        run: python tests/privacy_scan.py
      - name: Commit minimal diagnostic overlay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Scorp96"
          git config user.email "130877686+Scorp96@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(v64): rebuild minimal protected C279 diagnostic overlay"
          git push origin "HEAD:${GITHUB_REF_NAME}"
