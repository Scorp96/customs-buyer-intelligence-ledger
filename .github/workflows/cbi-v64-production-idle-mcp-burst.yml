name: CBI v6.4 production idle MCP burst

on:
  push:
    branches:
      - cbi-v64-production-idle-mcp-burst-20260919
    paths:
      - '.github/workflows/cbi-v64-production-idle-mcp-burst.yml'

permissions:
  contents: read

jobs:
  burst:
    name: Production idle MCP burst
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Measure read-only ingress without crawler load
        env:
          CBI_PRODUCTION_URL: https://cbi-v61-preview.onrender.com
          CBI_PRODUCTION_BEARER_TOKEN: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
          EXPECTED_SHA: 675a629d2eb6d1f92e48bc03382fc999750c9a7d
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures,json,os,statistics,time,urllib.error,urllib.request
          base=os.environ["CBI_PRODUCTION_URL"].rstrip("/")
          token=os.environ["CBI_PRODUCTION_BEARER_TOKEN"]
          expected=os.environ["EXPECTED_SHA"].lower()

          def http(req,timeout=45):
              t=time.monotonic()
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return r.status,dict(r.headers.items()),json.loads(r.read().decode()),time.monotonic()-t
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  try:p=json.loads(raw)
                  except Exception:p={"raw":raw[:500]}
                  return e.code,dict(e.headers.items()),p,time.monotonic()-t

          s,_,h,_=http(urllib.request.Request(base+"/healthz",headers={"Accept":"application/json"}),20)
          if s!=200 or str((h.get("deployment_identity") or {}).get("git_sha") or "").lower()!=expected:
              raise SystemExit("SHA_OR_HEALTH_MISMATCH")

          def one(i):
              rid=50000+i
              body=json.dumps({"jsonrpc":"2.0","id":rid,"method":"tools/list","params":{}},separators=(",",":")).encode()
              req=urllib.request.Request(base+"/mcp",data=body,method="POST",headers={
                  "Authorization":"Bearer "+token,"Content-Type":"application/json",
                  "Accept":"application/json","MCP-Protocol-Version":"2026-07-28"})
              status,headers,p,elapsed=http(req,30)
              return {"ok":status==200 and p.get("id")==rid and isinstance(p.get("result"),dict),
                      "status":status,"elapsed":elapsed,"retry_after":headers.get("Retry-After")}

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              rows=list(ex.map(one,range(16)))
          bad=[x for x in rows if not x["ok"]]
          if bad: raise SystemExit("IDLE_BURST_FAILURE:"+json.dumps(bad,sort_keys=True)[:2000])
          lat=[x["elapsed"] for x in rows]
          receipt={
              "status":"VERIFIED",
              "production_git_sha":expected,
              "total_requests":16,
              "max_concurrency":4,
              "http_429":sum(1 for x in rows if x["status"]==429),
              "latency_ms_p50":round(statistics.median(lat)*1000,1),
              "latency_ms_p95":round(sorted(lat)[int((len(lat)-1)*0.95)]*1000,1),
              "latency_ms_max":round(max(lat)*1000,1),
              "latencies_ms":[round(x*1000,1) for x in sorted(lat)]
          }
          print(json.dumps(receipt,sort_keys=True))
          PY
