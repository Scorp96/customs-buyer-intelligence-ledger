name: CBI v6.4 C279 static-admin ciphertext capture

on:
  push:
    branches:
      - "cbi-v64-c279-static-capture-*"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Verify static admin secret presence without disclosure
        shell: bash
        env:
          TOKEN: ${{ secrets.CBI_REMOTE_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "CBI_REMOTE_BEARER_TOKEN_SECRET_MISSING" >&2
            exit 2
          fi
          test "${#TOKEN}" -ge 32
          echo "CBI_REMOTE_BEARER_TOKEN_SECRET_PRESENT=YES"

      - name: Install pinned capture crypto
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input cryptography==50.0.1

      - name: Pin diagnostic deployment then capture ciphertext
        shell: bash
        env:
          CBI_V64_C279_CAPTURE_BEARER: ${{ secrets.CBI_REMOTE_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://cbi-v61-preview.onrender.com/healthz', timeout=10) as response:
              health = json.load(response)
          identity = health.get('deployment_identity') or {}
          assert identity.get('git_sha') == '88e00c38d6ade972505c8f9ab584aa81fd0e87ad', identity
          assert identity.get('object_store_mode') == 'r2', identity
          print('C279_CAPTURE_SOURCE_SHA=PINNED')
          PY
          mkdir -p "$RUNNER_TEMP/c279-static-capture"
          python scripts/capture_v64_c279_single_session.py \
            --base-url https://cbi-v61-preview.onrender.com \
            --recipient-public-key-b64 'CkGBhnHz7tZ/UEjjZP5mAMLNSsAL70pk8/q8AirHQw0=' \
            --output "$RUNNER_TEMP/c279-static-capture/c279-session-ciphertext.json"
          echo "C279_STATIC_ADMIN_CAPTURE=PASS"

      - name: Validate ciphertext-only artifact
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'c279-static-capture/c279-session-ciphertext.json'
          value = json.loads(path.read_text(encoding='utf-8'))
          assert set(value) == {'schema','ephemeral_public_key','salt','nonce','snapshot_sha256','ciphertext'}
          assert value.get('schema') == 'cbi.v64-c279-ciphertext.v1'
          assert 'payload' not in value
          print('C279_STATIC_CAPTURE_ARTIFACT_PRIVACY=PASS')
          PY

      - name: Upload ciphertext only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cbi-v64-c279-static-ciphertext-${{ github.sha }}
          path: ${{ runner.temp }}/c279-static-capture/c279-session-ciphertext.json
          if-no-files-found: error
          retention-days: 1
