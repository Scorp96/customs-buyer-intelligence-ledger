name: ASTRA receipt verification gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: astra-receipt-verify-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.event.comment.body, 'ASTRA_RECEIPT_V1 ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify ASTRA worker receipt
        run: python scripts/astra_receipt_gate.py --event "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASTRA_TASK_HMAC_KEY_B64: ${{ secrets.ASTRA_TASK_HMAC_KEY_B64 }}
          ASTRA_RECEIPT_HMAC_KEY_B64: ${{ secrets.ASTRA_RECEIPT_HMAC_KEY_B64 }}

# Operational note: GitHub only fires issue_comment workflows that exist on the default branch.
# Phase 2A activation therefore requires a separately reviewed main-branch shim that checks
# out an immutable, CI-green Phase 2A release commit before running this gate code.
