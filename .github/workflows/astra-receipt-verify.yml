# Generated by scripts/render_astra_gate_workflows.py. Do not hand-edit the pin.
name: ASTRA receipt verification gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: astra-receipt-verify-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.event.comment.body, 'ASTRA_RECEIPT_V1 ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable reviewed ASTRA control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Scorp96/customs-buyer-intelligence-ledger
          ref: 4808bfefb79ff4a87b0934aedad73a6ebba00ce3
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Verify ASTRA worker receipt
        run: python scripts/astra_receipt_gate.py --event "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASTRA_TASK_HMAC_KEY_B64: ${{ secrets.ASTRA_TASK_HMAC_KEY_B64 }}
          ASTRA_RECEIPT_HMAC_KEY_B64: ${{ secrets.ASTRA_RECEIPT_HMAC_KEY_B64 }}
