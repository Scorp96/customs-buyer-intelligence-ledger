name: CBI v6.4 one-shot backup manager GREEN

on:
  push:
    branches:
      - cbi-v64-backup-wal-hardening-20260909

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install timezone data
        run: python -m pip install --disable-pip-version-check --no-input tzdata==2026.3
      - name: Configure git
        run: |
          git config user.name 'cbi-v64-task4'
          git config user.email 'actions@users.noreply.github.com'
      - name: Patch backup manager and retention evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('unified_runtime/backup_recovery_hardened.py')
          text = path.read_text(encoding='utf-8')

          old = '''        host_root: str | Path,\n        backup_root: str | Path | None = None,\n    ):\n'''
          new = '''        host_root: str | Path,\n        backup_root: str | Path | None = None,\n        external_replica: Any | None = None,\n    ):\n'''
          if old not in text:
              raise SystemExit('constructor signature anchor not found')
          text = text.replace(old, new, 1)

          old = '''        self.source_fingerprint = hashlib.sha256(\n            str(self.source_session_root).encode("utf-8")\n        ).hexdigest()[:12]\n'''
          new = '''        self.source_fingerprint = hashlib.sha256(\n            str(self.source_session_root).encode("utf-8")\n        ).hexdigest()[:12]\n        self.external_replica = external_replica\n'''
          if old not in text:
              raise SystemExit('source fingerprint anchor not found')
          text = text.replace(old, new, 1)

          old = '''    def from_runtime(\n        cls,\n        runtime: Any,\n        backup_root: str | Path | None = None,\n    ) -> "ProductionBackupRecoveryManager":\n        return cls(\n            session_root=runtime.store.root,\n            canonical_root=runtime.canonical_registry.root,\n            pending_root=runtime.pending_journal.root,\n            host_root=runtime._v6_queue().root,\n            backup_root=backup_root,\n        )\n'''
          new = '''    def from_runtime(\n        cls,\n        runtime: Any,\n        backup_root: str | Path | None = None,\n        external_replica: Any | None = None,\n    ) -> "ProductionBackupRecoveryManager":\n        return cls(\n            session_root=runtime.store.root,\n            canonical_root=runtime.canonical_registry.root,\n            pending_root=runtime.pending_journal.root,\n            host_root=runtime._v6_queue().root,\n            backup_root=backup_root,\n            external_replica=external_replica,\n        )\n'''
          if old not in text:
              raise SystemExit('from_runtime anchor not found')
          text = text.replace(old, new, 1)

          old = '''    def for_session_root(\n        cls,\n        session_root: str | Path,\n        backup_root: str | Path | None = None,\n    ) -> "ProductionBackupRecoveryManager":\n'''
          new = '''    def for_session_root(\n        cls,\n        session_root: str | Path,\n        backup_root: str | Path | None = None,\n        external_replica: Any | None = None,\n    ) -> "ProductionBackupRecoveryManager":\n'''
          if old not in text:
              raise SystemExit('for_session_root signature anchor not found')
          text = text.replace(old, new, 1)

          old = '''            host_root=host,\n            backup_root=backup_root,\n        )\n\n    def _snapshot_dirs(self) -> list[Path]:\n'''
          new = '''            host_root=host,\n            backup_root=backup_root,\n            external_replica=external_replica,\n        )\n\n    def _replicate_snapshot_result(self, result: dict[str, Any]) -> dict[str, Any]:\n        if self.external_replica is None:\n            return {\n                **result,\n                "external_replication_configured": False,\n                "external_replicated": False,\n                "external_snapshot_id": None,\n                "external_archive_sha256": None,\n                "external_snapshot_locator": None,\n                "backup_root_persistence_mode": "LOCAL_ONLY",\n            }\n        external = self.external_replica.replicate_snapshot(\n            Path(str(result.get("path") or "")),\n            str(result.get("snapshot_id") or ""),\n        )\n        if (\n            not isinstance(external, dict)\n            or external.get("verified") is not True\n            or external.get("snapshot_id") != result.get("snapshot_id")\n        ):\n            raise ValidationError("external backup replication verification failed")\n        return {\n            **result,\n            "external_replication_configured": True,\n            "external_replicated": True,\n            "external_snapshot_id": external.get("snapshot_id"),\n            "external_archive_sha256": external.get("archive_sha256"),\n            "external_snapshot_locator": external.get("manifest_key"),\n            "backup_root_persistence_mode": "OBJECT_STORE_REPLICATED",\n        }\n\n    def _snapshot_dirs(self) -> list[Path]:\n'''
          if old not in text:
              raise SystemExit('helper insertion anchor not found')
          text = text.replace(old, new, 1)

          old = '''    def create_snapshot(self, reasons: str | list[str] | tuple[str, ...]) -> dict[str, Any]:\n        normalized = _normalize_reasons(reasons)\n        self.backup_root.mkdir(parents=True, exist_ok=True)\n        with exclusive_file_lock(self.backup_root / ".backup.lock", timeout_seconds=120.0):\n            return self._create_locked(normalized)\n'''
          new = '''    def create_snapshot(self, reasons: str | list[str] | tuple[str, ...]) -> dict[str, Any]:\n        normalized = _normalize_reasons(reasons)\n        self.backup_root.mkdir(parents=True, exist_ok=True)\n        with exclusive_file_lock(self.backup_root / ".backup.lock", timeout_seconds=120.0):\n            result = self._create_locked(normalized)\n        return self._replicate_snapshot_result(result)\n'''
          if old not in text:
              raise SystemExit('create_snapshot anchor not found')
          text = text.replace(old, new, 1)

          old = '''        with exclusive_file_lock(self.backup_root / ".backup.lock", timeout_seconds=120.0):\n            existing = self._marker_snapshot(marker)\n            if existing is not None:\n                return existing\n            result = self._create_locked(["DAILY"])\n            _atomic_json(marker, {"snapshot_id": result["snapshot_id"], "created_at": result["created_at"], "utc_date": date})\n            return {**result, "marker": str(marker)}\n'''
          new = '''        with exclusive_file_lock(self.backup_root / ".backup.lock", timeout_seconds=120.0):\n            existing = self._marker_snapshot(marker)\n            if existing is not None:\n                local = existing\n            else:\n                result = self._create_locked(["DAILY"])\n                _atomic_json(marker, {"snapshot_id": result["snapshot_id"], "created_at": result["created_at"], "utc_date": date})\n                local = {**result, "marker": str(marker)}\n        return self._replicate_snapshot_result(local)\n'''
          if old not in text:
              raise SystemExit('daily anchor not found')
          text = text.replace(old, new, 1)

          old = '''        with exclusive_file_lock(self.backup_root / ".backup.lock", timeout_seconds=120.0):\n            existing = self._marker_snapshot(marker)\n            if existing is not None:\n                return existing\n            result = self._create_locked(normalized)\n            _atomic_json(marker, {\n                "snapshot_id": result["snapshot_id"],\n                "created_at": result["created_at"],\n                "reasons": normalized,\n                "guard_key_sha256": hashlib.sha256(str(guard_key).encode("utf-8")).hexdigest(),\n            })\n            return {**result, "marker": str(marker)}\n'''
          new = '''        with exclusive_file_lock(self.backup_root / ".backup.lock", timeout_seconds=120.0):\n            existing = self._marker_snapshot(marker)\n            if existing is not None:\n                local = existing\n            else:\n                result = self._create_locked(normalized)\n                _atomic_json(marker, {\n                    "snapshot_id": result["snapshot_id"],\n                    "created_at": result["created_at"],\n                    "reasons": normalized,\n                    "guard_key_sha256": hashlib.sha256(str(guard_key).encode("utf-8")).hexdigest(),\n                })\n                local = {**result, "marker": str(marker)}\n        return self._replicate_snapshot_result(local)\n'''
          if old not in text:
              raise SystemExit('guard anchor not found')
          text = text.replace(old, new, 1)

          old = '''        date = datetime.now(timezone.utc).date().isoformat()\n        daily = self._marker_snapshot(self._marker("daily", date)) if validate_latest else None\n        return {\n            "schema": "cbi.backup-status.v6.1",\n            "source_session_root": str(self.source_session_root),\n            "backup_root": str(self.backup_root),\n            "latest": latest,\n            "daily_snapshot_present": daily is not None if validate_latest else self._marker("daily", date).is_file(),\n            "daily_snapshot": daily,\n            "restore_overwrites_live_root": False,\n        }\n'''
          new = '''        date = datetime.now(timezone.utc).date().isoformat()\n        daily = self._marker_snapshot(self._marker("daily", date)) if validate_latest else None\n        durable_latest = None\n        external_replication_verified = False\n        external_replication_error = None\n        if self.external_replica is not None:\n            try:\n                candidate = self.external_replica.latest_snapshot()\n                if isinstance(candidate, dict) and candidate.get("verified") is True:\n                    durable_latest = {\n                        "snapshot_id": candidate.get("snapshot_id"),\n                        "created_at": candidate.get("created_at"),\n                        "reasons": list(candidate.get("reasons") or []),\n                        "verified": True,\n                        "archive_sha256": candidate.get("archive_sha256"),\n                        "persistence_mode": candidate.get("persistence_mode") or "OBJECT_STORE_REPLICATED",\n                    }\n                    external_replication_verified = bool(durable_latest.get("snapshot_id"))\n                    external_snapshot_locator = candidate.get("manifest_key")\n                else:\n                    external_snapshot_locator = None\n            except Exception as exc:\n                external_snapshot_locator = None\n                external_replication_error = type(exc).__name__\n        else:\n            external_snapshot_locator = None\n        return {\n            "schema": "cbi.backup-status.v6.1",\n            "source_session_root": str(self.source_session_root),\n            "backup_root": str(self.backup_root),\n            "latest": latest,\n            "durable_latest": durable_latest,\n            "daily_snapshot_present": daily is not None if validate_latest else self._marker("daily", date).is_file(),\n            "daily_snapshot": daily,\n            "external_replication_configured": self.external_replica is not None,\n            "external_replication_verified": external_replication_verified,\n            "external_snapshot_locator": external_snapshot_locator,\n            "external_replication_error": external_replication_error,\n            "backup_root_persistence_mode": (\n                "OBJECT_STORE_REPLICATED"\n                if external_replication_verified\n                else "LOCAL_ONLY_WITH_EXTERNAL_REPLICA_PENDING"\n                if self.external_replica is not None\n                else "LOCAL_ONLY"\n            ),\n            "restore_overwrites_live_root": False,\n        }\n'''
          if old not in text:
              raise SystemExit('status anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('unified_runtime/backup_retention_evidence_v64.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _snapshot_id(status: dict[str, Any]) -> str:\n    return str(dict(status.get("latest") or {}).get("snapshot_id") or "").strip()\n'''
          new = '''def _snapshot_id(status: dict[str, Any]) -> str:\n    durable = dict(status.get("durable_latest") or {})\n    local = dict(status.get("latest") or {})\n    return str(durable.get("snapshot_id") or local.get("snapshot_id") or "").strip()\n'''
          if old not in text:
              raise SystemExit('retention snapshot-id anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify Task 4 manager GREEN before push
        run: |
          python -m unittest \
            tests.test_v64_backup_retention_runtime \
            tests.test_v64_backup_object_store \
            tests.test_v61_backup_recovery \
            tests.test_v64_stream_b_semantic_forward_port \
            tests.test_v64_request_scoped_verified_snapshot \
            tests.test_v64_state_query_performance_protocol -v
      - name: Commit implementation and remove one-shot runner
        run: |
          git add unified_runtime/backup_recovery_hardened.py unified_runtime/backup_retention_evidence_v64.py
          git commit -m 'feat(v64): integrate durable external backup retention'
          git rm .github/workflows/cbi-v64-task4-manager-green.yml
          git commit -m 'chore(v64): remove task4 manager GREEN runner'
      - name: Push verified result
        run: git push origin HEAD:cbi-v64-backup-wal-hardening-20260909
