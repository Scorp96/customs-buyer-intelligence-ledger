name: CBI v6.4 performance TDD

on:
  push:
    branches:
      - cbi-v64-release-candidate-performance-takeover-20260909
    paths:
      - unified_runtime/core.py
      - unified_runtime/research_orchestration_hardening.py
      - scripts/run_v6_load_acceptance.py
      - tests/test_v61_load_acceptance.py
      - tests/test_v64_request_scoped_verified_snapshot.py
      - .github/workflows/cbi-v64-performance-tdd.yml

permissions:
  contents: read

concurrency:
  group: cbi-v64-performance-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Run request snapshot and performance protocol contracts
        run: >-
          python -m unittest -v
          tests.test_v64_request_scoped_verified_snapshot
          tests.test_v61_load_acceptance
