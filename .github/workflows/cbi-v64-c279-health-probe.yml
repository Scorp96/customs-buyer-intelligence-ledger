name: CBI v6.4 C279 live MCP surface inventory

on:
  push:
    branches:
      - cbi-v64-c279-health-probe-a311a2a

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pin public production identity
        shell: python
        run: |
          import json, urllib.request
          req = urllib.request.Request(
              "https://cbi-v61-preview.onrender.com/healthz",
              headers={"Accept":"application/json","User-Agent":"cbi-v64-c279-surface-inventory"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))
          ident = payload.get("deployment_identity") or {}
          persistence = payload.get("object_store_persistence") or {}
          assert ident.get("git_sha") == "a311a2a57ee43a1f1a3b2819bf28946566b05692"
          assert ident.get("object_state_generation") == 669
          assert persistence.get("recovery_fingerprint_sha256") == "3a3014f6bba6986cfc46bab676acdc087985f1fdbe6535a4317f6d0670cf0422"
          print("C279_CURRENT_CLOUD_IDENTITY=PINNED")

      - name: List live MCP tool names only
        shell: python
        env:
          CBI_READONLY_BEARER: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
        run: |
          import json, os, urllib.request
          token = os.environ.get("CBI_READONLY_BEARER", "")
          if len(token) < 32:
              raise SystemExit("C279_READONLY_BEARER_UNAVAILABLE")
          body = json.dumps({"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}, separators=(",",":")).encode()
          req = urllib.request.Request(
              "https://cbi-v61-preview.onrender.com/mcp", data=body, method="POST",
              headers={
                  "Authorization":"Bearer " + token,
                  "Content-Type":"application/json",
                  "Accept":"application/json",
                  "MCP-Protocol-Version":"2026-07-28",
                  "User-Agent":"cbi-v64-c279-surface-inventory",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))
          if payload.get("error"):
              raise SystemExit("C279_TOOLS_LIST_RPC_ERROR")
          names = sorted(str(row.get("name") or "") for row in ((payload.get("result") or {}).get("tools") or []) if row.get("name"))
          print("C279_LIVE_TOOL_COUNT=" + str(len(names)))
          for name in names:
              print("C279_LIVE_TOOL=" + name)
          exportish = [name for name in names if any(token in name.lower() for token in ("event","session","export","snapshot","backup","log","raw"))]
          print("C279_EXPORTISH_TOOL_NAMES=" + json.dumps(exportish, separators=(",",":")))

      - name: Assert production ref remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote https://github.com/Scorp96/customs-buyer-intelligence-ledger refs/heads/cbi-v6-cloud-runtime-20260901 | cut -f1)"
          test "$remote" = "a311a2a57ee43a1f1a3b2819bf28946566b05692"
          echo "C279_PRODUCTION_REF_UNCHANGED=$remote"
