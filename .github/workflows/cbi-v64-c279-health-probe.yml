name: CBI v6.4 C279 health probe

on:
  push:
    branches:
      - cbi-v64-c279-health-probe-a311a2a

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public health metadata only
        shell: python
        run: |
          import json
          import urllib.request

          url = "https://cbi-v61-preview.onrender.com/healthz"
          request = urllib.request.Request(
              url,
              headers={"Accept": "application/json", "User-Agent": "cbi-v64-c279-health-probe"},
              method="GET",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              raw = response.read()
          payload = json.loads(raw.decode("utf-8"))
          allowed_top = {
              "status", "service", "transport", "durable_root_bound",
              "backup_recovery_enabled", "object_store_persistence_enabled",
              "remote_post_handler_checkpoint_enabled", "deployment_identity",
              "object_store_persistence", "durable_state_loaded", "mcp_enabled",
              "object_store_configured",
          }
          safe = {k: payload.get(k) for k in allowed_top if k in payload}
          # Health metadata is intentionally public, but keep only operational
          # identity/state fields and never print arbitrary response keys.
          print("C279_HEALTH_SAFE=" + json.dumps(safe, sort_keys=True, separators=(",", ":")))
          assert payload.get("status") in {"ok", "degraded", "bootstrap_required"}
