name: CBI v6.3 production live SHA probe

on:
  pull_request:
    branches:
      - cbi-v6-cloud-runtime-20260901

permissions:
  contents: read

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Render health and exact deployment SHA
        env:
          EXPECTED_SHA: a311a2a57ee43a1f1a3b2819bf28946566b05692
          HEALTH_URL: https://cbi-v61-preview.onrender.com/healthz
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          http_code="$(
            curl \
              --location \
              --silent \
              --show-error \
              --retry 8 \
              --retry-all-errors \
              --retry-delay 10 \
              --connect-timeout 20 \
              --max-time 180 \
              --output "$body" \
              --write-out '%{http_code}' \
              "$HEALTH_URL"
          )"
          test "$http_code" = "200"
          python - "$body" "$EXPECTED_SHA" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          expected = sys.argv[2].lower()
          health = json.loads(path.read_text(encoding="utf-8"))
          identity = health.get("deployment_identity") or {}

          safe = {
              "status": health.get("status"),
              "durable_root_bound": health.get("durable_root_bound"),
              "backup_recovery_enabled": health.get("backup_recovery_enabled"),
              "object_store_persistence_enabled": health.get("object_store_persistence_enabled"),
              "remote_post_handler_checkpoint_enabled": health.get("remote_post_handler_checkpoint_enabled"),
              "deployment_identity": {
                  "schema": identity.get("schema"),
                  "git_sha": identity.get("git_sha"),
                  "git_sha_source": identity.get("git_sha_source"),
                  "remote_entrypoint": identity.get("remote_entrypoint"),
                  "runtime_entrypoint": identity.get("runtime_entrypoint"),
                  "object_store_mode": identity.get("object_store_mode"),
                  "object_state_schema": identity.get("object_state_schema"),
                  "object_state_generation": identity.get("object_state_generation"),
                  "restore_generation": identity.get("restore_generation"),
                  "restore_source": identity.get("restore_source"),
              },
          }
          print(json.dumps(safe, sort_keys=True))

          assert health.get("status") == "ok", safe
          assert health.get("durable_root_bound") is True, safe
          assert health.get("backup_recovery_enabled") is True, safe
          assert health.get("object_store_persistence_enabled") is True, safe
          assert health.get("remote_post_handler_checkpoint_enabled") is True, safe
          assert identity.get("schema") == "cbi.remote-deployment-identity.v6.3", safe
          assert str(identity.get("git_sha") or "").lower() == expected, safe
          assert identity.get("git_sha_source") == "RENDER_GIT_COMMIT", safe
          assert identity.get("remote_entrypoint") == "mcp/server_v61_remote.py", safe
          assert identity.get("runtime_entrypoint") == "mcp/server_v61_backup_recovery.py", safe
          assert identity.get("object_store_mode") in {"r2", "s3"}, safe
          assert identity.get("object_state_schema") == "cbi.object-store-state.v2", safe
          PY
