name: CBI v6.4 one-shot production tool surface GREEN

on:
  push:
    branches:
      - cbi-v64-backup-wal-hardening-20260909

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install timezone data
        run: python -m pip install --disable-pip-version-check --no-input tzdata==2026.3
      - name: Configure git
        run: |
          git config user.name 'cbi-v64-tool-surface'
          git config user.email 'cbi-v64-tool-surface@example.invalid'
      - name: Implement adapter-only production tool declaration
        run: python scripts/cbi_v64_tool_surface_declaration_green.py
      - name: Verify declaration GREEN before push
        run: |
          python -m unittest tests.test_v64_production_tool_surface_declaration -v
          python -m unittest tests.test_v64_mutation_wal_audit_mcp tests.test_v64_mutation_wal_audit -v
          python -m unittest tests.test_v6_windows_portability -v
          python -m unittest discover -s tests -p '*mcp*.py'
          python tests/privacy_scan.py
          python -m compileall -q mcp unified_runtime
      - name: Commit implementation and remove temporary helpers
        run: |
          git add unified_runtime/production_tool_surface_v64.py mcp/server_v61.py tests/test_v6_windows_portability.py
          git commit -m 'fix(v64): declare production adapter MCP tools separately'
          git rm .github/workflows/cbi-v64-tool-surface-declaration-green.yml scripts/cbi_v64_tool_surface_declaration_green.py
          git commit -m 'chore(v64): remove tool-surface GREEN helpers'
      - name: Push verified result
        run: git push origin HEAD:cbi-v64-backup-wal-hardening-20260909
