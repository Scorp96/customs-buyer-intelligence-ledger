name: CBI v6.3 Production post-deploy read-only Canary

on:
  push:
    branches:
      - cbi-v63-production-integration-evidence-20260919-d4eb609
    paths:
      - '.github/workflows/cbi-v63-production-postdeploy-readonly-canary.yml'

permissions:
  contents: read

jobs:
  canary:
    name: Production post-deploy Tesoro Van Nhan read-only Canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run authenticated Production read-only Canary
        env:
          CBI_PRODUCTION_URL: https://cbi-v61-preview.onrender.com
          CBI_PRODUCTION_BEARER_TOKEN: ${{ secrets.CBI_V63_ACCEPTANCE_BEARER_TOKEN }}
          EXPECTED_PRODUCTION_SHA: 11429b041c1714c2074c45193bf0a13b8a2ca16f
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          base = os.environ["CBI_PRODUCTION_URL"].rstrip("/")
          token = os.environ.get("CBI_PRODUCTION_BEARER_TOKEN", "")
          expected_sha = os.environ["EXPECTED_PRODUCTION_SHA"]
          if len(token) < 32:
              raise SystemExit("PRODUCTION_BEARER_SECRET_UNAVAILABLE")

          def get_health():
              req = urllib.request.Request(base + "/healthz", method="GET", headers={"Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode())

          request_id = 1
          def rpc(method, params):
              global request_id
              rid = request_id
              request_id += 1
              body = json.dumps({"jsonrpc":"2.0","id":rid,"method":method,"params":params}, separators=(",",":")).encode()
              req = urllib.request.Request(
                  base + "/mcp", data=body, method="POST",
                  headers={
                      "Authorization":"Bearer " + token,
                      "Content-Type":"application/json",
                      "Accept":"application/json",
                      "MCP-Protocol-Version":"2026-07-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      payload = json.loads(resp.read().decode())
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"MCP_HTTP_{exc.code}:" + exc.read().decode("utf-8","replace")[:500])
              if payload.get("id") != rid:
                  raise SystemExit("MCP_RESPONSE_ID_MISMATCH")
              if payload.get("error"):
                  raise SystemExit("MCP_RPC_ERROR:" + json.dumps(payload["error"], sort_keys=True)[:800])
              return payload.get("result") or {}

          def call_tool(name, arguments):
              result = rpc("tools/call", {"name":name,"arguments":arguments})
              structured = result.get("structuredContent")
              if not isinstance(structured, dict):
                  raise SystemExit("STRUCTURED_CONTENT_MISSING:" + name)
              return structured

          before = get_health()
          ident = before.get("deployment_identity") or {}
          store = before.get("object_store_persistence") or {}
          if before.get("status") != "ok":
              raise SystemExit("PRODUCTION_HEALTH_NOT_OK")
          if ident.get("git_sha") != expected_sha:
              raise SystemExit("PRODUCTION_GIT_SHA_MISMATCH")
          if ident.get("object_state_schema") != "cbi.object-store-state.v2":
              raise SystemExit("PRODUCTION_OBJECT_STATE_SCHEMA_MISMATCH")
          if ident.get("restore_generation") != ident.get("object_state_generation"):
              raise SystemExit("PRODUCTION_RESTORE_GENERATION_MISMATCH")
          if ident.get("restore_source") != "object_state_v2":
              raise SystemExit("PRODUCTION_RESTORE_SOURCE_MISMATCH")
          if store.get("last_error") is not None:
              raise SystemExit("PRODUCTION_OBJECT_STORE_ERROR")
          generation_before = store.get("generation")

          listed = rpc("tools/list", {})
          names = sorted(
              row.get("name")
              for row in listed.get("tools", [])
              if isinstance(row, dict) and row.get("name")
          )
          required = {
              "get_product_opportunities",
              "get_demand_anchors",
              "get_market_cells",
              "evaluate_market_acceptance",
              "get_expansion_state",
              "get_portfolio_metrics",
              "plan_contact_exhaustion",
          }
          missing = sorted(required - set(names))
          if missing:
              raise SystemExit("PRODUCTION_REQUIRED_READ_TOOLS_MISSING:" + ",".join(missing))

          cases = [
              {
                  "case":"TESORO",
                  "investigation_id":"INV-20260829T074838Z-b3f3984b20d8",
                  "opportunity_id":"OPP-TESORO-PVC-CANARY-20260918",
                  "account_id":"TESORO-EN-MADERAS-II-PR",
              },
              {
                  "case":"VAN_NHAN",
                  "investigation_id":"INV-20260824T063846Z-4d333e50f706",
                  "opportunity_id":"OPP-VN-0107809749-PVC-CANARY-20260918",
                  "account_id":"VN-0107809749",
              },
          ]
          receipts = []
          for case in cases:
              inv = case["investigation_id"]
              opp_id = case["opportunity_id"]
              account_id = case["account_id"]

              health = call_tool("get_investigation_health", {"investigation_id":inv})
              if health.get("status") != "READY":
                  raise SystemExit(case["case"] + "_INVESTIGATION_NOT_READY")

              projection = call_tool("get_product_opportunities", {
                  "investigation_id":inv,
                  "opportunity_id":opp_id,
              })
              rows = projection.get("opportunities") or []
              if len(rows) != 1:
                  raise SystemExit(case["case"] + "_OPPORTUNITY_COUNT_MISMATCH")
              opp = rows[0]
              if opp.get("opportunity_id") != opp_id:
                  raise SystemExit(case["case"] + "_OPPORTUNITY_ID_MISMATCH")
              if opp.get("account_id") != account_id:
                  raise SystemExit(case["case"] + "_ACCOUNT_ID_MISMATCH")
              if str(opp.get("product_profile_id") or "").upper() != "PVC":
                  raise SystemExit(case["case"] + "_PRODUCT_PROFILE_NOT_PVC")

              planner = call_tool("plan_contact_exhaustion", {
                  "investigation_id":inv,
                  "opportunity_id":opp_id,
                  "account_id":account_id,
                  "product_profile_id":"PVC",
                  "current_routes":{},
              })
              if str(planner.get("product_profile_id") or "").upper() != "PVC":
                  raise SystemExit(case["case"] + "_PLANNER_PRODUCT_PROFILE_MISMATCH")

              metrics = call_tool("get_portfolio_metrics", {
                  "investigation_id":inv,
                  "opportunity_id":opp_id,
                  "product_profile_id":"PVC",
              })
              if metrics.get("product_opportunity_count") != 1:
                  raise SystemExit(case["case"] + "_METRICS_OPPORTUNITY_COUNT_MISMATCH")
              if metrics.get("unique_account_count") != 1:
                  raise SystemExit(case["case"] + "_METRICS_ACCOUNT_COUNT_MISMATCH")

              receipts.append({
                  "case":case["case"],
                  "investigation_id":inv,
                  "opportunity_id":opp_id,
                  "account_id":account_id,
                  "product_profile_id":opp.get("product_profile_id"),
                  "lifecycle_stage":opp.get("lifecycle_stage"),
                  "planner_product_profile_id":planner.get("product_profile_id"),
                  "metrics":{
                      "product_opportunity_count":metrics.get("product_opportunity_count"),
                      "unique_account_count":metrics.get("unique_account_count"),
                  },
              })

          after = get_health()
          ident_after = after.get("deployment_identity") or {}
          store_after = after.get("object_store_persistence") or {}
          if ident_after.get("git_sha") != expected_sha:
              raise SystemExit("PRODUCTION_SHA_CHANGED_DURING_CANARY")
          if store_after.get("generation") != generation_before:
              raise SystemExit("PRODUCTION_GENERATION_CHANGED_DURING_READ_ONLY_CANARY")
          if store_after.get("last_error") is not None:
              raise SystemExit("PRODUCTION_OBJECT_STORE_ERROR_AFTER_CANARY")

          print(json.dumps({
              "schema":"cbi.v63-production-postdeploy-readonly-canary.v1",
              "status":"VERIFIED",
              "production_git_sha":expected_sha,
              "object_state_generation":generation_before,
              "required_read_tools_present":True,
              "production_write_performed":False,
              "generation_unchanged":True,
              "canaries":receipts,
          }, sort_keys=True))
          PY
