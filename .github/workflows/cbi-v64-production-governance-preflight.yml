name: CBI v6.4 production governance preflight

on:
  push:
    branches:
      - cbi-v64-c279-health-probe-a311a2a
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cbi-v64-production-governance-preflight
  cancel-in-progress: false

env:
  CBI_PRODUCTION_BRANCH: cbi-v6-cloud-runtime-20260901
  CBI_PRODUCTION_SHA: a311a2a57ee43a1f1a3b2819bf28946566b05692
  CBI_RELEASE_CANDIDATE_SHA: 4733a9b3e7286b58828750542c7ad54057cfb8ad
  CBI_RELEASE_CI_RUN_ID: '33936239839'

jobs:
  governance:
    name: Production governance read-only preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit repository rulesets and production branch
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = "Scorp96/customs-buyer-intelligence-ledger"
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept":"application/vnd.github+json",
              "Authorization":"Bearer " + token,
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"cbi-v64-production-governance-preflight",
          }
          def get(path):
              req = urllib.request.Request("https://api.github.com" + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          rulesets = get(f"/repos/{repo}/rulesets?includes_parents=true")
          by_name = {str(row.get("name") or ""): row for row in rulesets}
          main = by_name.get("protect-main")
          if not main or main.get("enforcement") != "active":
              raise SystemExit("PROTECT_MAIN_MISSING_OR_INACTIVE")
          main_detail = get(f"/repos/{repo}/rulesets/{main['id']}")
          if ((main_detail.get("conditions") or {}).get("ref_name") or {}).get("include") != ["~DEFAULT_BRANCH"]:
              raise SystemExit("PROTECT_MAIN_TARGET_DRIFT")
          # current_user_can_bypass is viewer-relative; bypass_actors is the
          # durable repository rule and is stable across API identities.
          if main_detail.get("bypass_actors") != []:
              raise SystemExit("PROTECT_MAIN_BYPASS_ACTORS_DRIFT")

          required = [
              "regression (ubuntu-latest, py3.10)",
              "regression (ubuntu-latest, py3.11)",
              "regression (windows-latest, py3.10)",
              "regression (windows-latest, py3.11)",
          ]
          rules_by_type = {str(row.get("type") or ""): row for row in (main_detail.get("rules") or [])}
          if "deletion" not in rules_by_type or "non_fast_forward" not in rules_by_type or "pull_request" not in rules_by_type:
              raise SystemExit("PROTECT_MAIN_SAFETY_RULE_DRIFT")
          pr = (rules_by_type["pull_request"].get("parameters") or {})
          if pr.get("required_approving_review_count") != 0 or pr.get("required_review_thread_resolution") is not True:
              raise SystemExit("PROTECT_MAIN_PR_RULE_DRIFT")
          status = ((rules_by_type.get("required_status_checks") or {}).get("parameters") or {})
          contexts = [str(row.get("context") or "") for row in (status.get("required_status_checks") or [])]
          if contexts != required or status.get("strict_required_status_checks_policy") is not True:
              raise SystemExit("PROTECT_MAIN_REQUIRED_CONTEXT_DRIFT")

          prod = get(f"/repos/{repo}/branches/{os.environ['CBI_PRODUCTION_BRANCH']}")
          if ((prod.get("commit") or {}).get("sha")) != os.environ["CBI_PRODUCTION_SHA"]:
              raise SystemExit("PRODUCTION_BRANCH_SHA_DRIFT")

          target = by_name.get("protect-cbi-production")
          target_valid = False
          if target is not None:
              target_detail = get(f"/repos/{repo}/rulesets/{target['id']}")
              include = (((target_detail.get("conditions") or {}).get("ref_name") or {}).get("include") or [])
              target_rules = {str(row.get("type") or ""): row for row in (target_detail.get("rules") or [])}
              target_status = ((target_rules.get("required_status_checks") or {}).get("parameters") or {})
              target_contexts = [str(row.get("context") or "") for row in (target_status.get("required_status_checks") or [])]
              target_pr = ((target_rules.get("pull_request") or {}).get("parameters") or {})
              target_valid = (
                  target_detail.get("enforcement") == "active"
                  and f"refs/heads/{os.environ['CBI_PRODUCTION_BRANCH']}" in include
                  and "deletion" in target_rules
                  and "non_fast_forward" in target_rules
                  and "pull_request" in target_rules
                  and target_pr.get("required_approving_review_count") == 0
                  and target_pr.get("required_review_thread_resolution") is True
                  and target_status.get("strict_required_status_checks_policy") is True
                  and target_contexts == required
                  and target_detail.get("bypass_actors") == []
              )

          result = "GREEN" if target_valid else "BLOCKED_EXTERNAL"
          blocker = None if target_valid else ("PRODUCTION_RULESET_MISSING" if target is None else "PRODUCTION_RULESET_INVALID")
          safe = {
              "schema":"cbi.v64-production-governance-preflight.v1",
              "result":result,
              "blocker":blocker,
              "protect_main_id":main.get("id"),
              "protect_main_active":True,
              "required_status_contexts":required,
              "production_branch":os.environ["CBI_PRODUCTION_BRANCH"],
              "production_sha":os.environ["CBI_PRODUCTION_SHA"],
              "production_branch_protected_flag":bool(prod.get("protected")),
              "protect_cbi_production_present":target is not None,
              "protect_cbi_production_valid":target_valid,
              "repository_governance_mutated":False,
          }
          Path(os.environ["RUNNER_TEMP"]).joinpath("governance.json").write_text(json.dumps(safe, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("CBI_V64_PRODUCTION_GOVERNANCE=" + json.dumps(safe, sort_keys=True, separators=(",",":")))

      - name: Verify exact release-candidate four-matrix evidence still exists
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import urllib.request
          from pathlib import Path
          repo = "Scorp96/customs-buyer-intelligence-ledger"
          headers = {
              "Accept":"application/vnd.github+json",
              "Authorization":"Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"cbi-v64-production-governance-preflight",
          }
          def get(path):
              req = urllib.request.Request("https://api.github.com" + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))
          run_id = os.environ["CBI_RELEASE_CI_RUN_ID"]
          run = get(f"/repos/{repo}/actions/runs/{run_id}")
          if run.get("head_sha") != os.environ["CBI_RELEASE_CANDIDATE_SHA"] or run.get("conclusion") != "success":
              raise SystemExit("RELEASE_CI_EXACT_SHA_EVIDENCE_DRIFT")
          jobs = (get(f"/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100").get("jobs") or [])
          required = {
              "regression (ubuntu-latest, py3.10)",
              "regression (ubuntu-latest, py3.11)",
              "regression (windows-latest, py3.10)",
              "regression (windows-latest, py3.11)",
          }
          observed = {str(job.get("name") or "") for job in jobs if job.get("conclusion") == "success"}
          missing = sorted(required - observed)
          if missing:
              raise SystemExit("RELEASE_CI_REQUIRED_JOB_MISSING:" + ",".join(missing))
          safe = {
              "run_id":int(run_id),"head_sha":run.get("head_sha"),"conclusion":run.get("conclusion"),
              "required_matrix_jobs_green":sorted(required),
          }
          Path(os.environ["RUNNER_TEMP"]).joinpath("release-ci.json").write_text(json.dumps(safe, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("CBI_V64_RELEASE_CI_EVIDENCE=" + json.dumps(safe, sort_keys=True, separators=(",",":")))

      - name: Emit combined governance evidence
        shell: python
        run: |
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          governance = json.loads((root / "governance.json").read_text(encoding="utf-8"))
          release_ci = json.loads((root / "release-ci.json").read_text(encoding="utf-8"))
          report = {
              "schema":"cbi.v64-production-governance-evidence.v1",
              "governance":governance,
              "release_candidate_ci":release_ci,
              "production_mutated":False,
          }
          (root / "CBI_V64_PRODUCTION_GOVERNANCE_PREFLIGHT.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("CBI_V64_PRODUCTION_GOVERNANCE_RESULT=" + governance["result"])
          if governance.get("blocker"):
              print("CBI_V64_PRODUCTION_GOVERNANCE_BLOCKER=" + governance["blocker"])

      - name: Upload sanitized governance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cbi-v64-production-governance-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/CBI_V64_PRODUCTION_GOVERNANCE_PREFLIGHT.json

      - name: Assert candidate and production refs remain unchanged
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          prod="$(git ls-remote https://github.com/Scorp96/customs-buyer-intelligence-ledger refs/heads/$CBI_PRODUCTION_BRANCH | cut -f1)"
          cand="$(git ls-remote https://github.com/Scorp96/customs-buyer-intelligence-ledger refs/heads/cbi-v64-release-candidate-58e14973 | cut -f1)"
          test "$prod" = "$CBI_PRODUCTION_SHA"
          test "$cand" = "$CBI_RELEASE_CANDIDATE_SHA"
          echo "CBI_PRODUCTION_REF_UNCHANGED=$prod"
          echo "CBI_RELEASE_CANDIDATE_REF_UNCHANGED=$cand"
