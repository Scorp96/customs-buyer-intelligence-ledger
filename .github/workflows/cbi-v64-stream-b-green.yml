name: CBI v6.4 Stream B GREEN semantic forward-port

on:
  push:
    branches: [cbi-v64-semantic-forward-port-58e14973]
    paths: [.cbi-v64-stream-b/GREEN_READY]

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: cbi-v64-semantic-forward-port-58e14973

      - name: Verify immutable refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/cbi-v6-3-demand-expansion | awk '{print $1}')" = '58e14973c62cca5a9daefa7b4012e427135736d5'
          test "$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')" = 'a311a2a57ee43a1f1a3b2819bf28946566b05692'

      - name: Implement current-source semantic forward-port
        shell: bash
        run: |
          set -euo pipefail
          cat > unified_runtime/backup_retention_evidence_v64.py <<'PYFILE'
          from __future__ import annotations

          from typing import Any


          _DURABLE_BACKUP_MODES = {
              "OBJECT_STORE_REPLICATED",
              "EXTERNAL_DURABLE_ROOT",
              "PERSISTENT_VOLUME_WITH_EXTERNAL_REPLICA",
          }


          def _backup_status(health: dict[str, Any] | None) -> dict[str, Any]:
              payload = dict(health or {})
              status = dict(payload.get("backup_recovery") or {})
              return status if status.get("schema") == "cbi.backup-status.v6.1" else {}


          def _snapshot_id(status: dict[str, Any]) -> str:
              return str(dict(status.get("latest") or {}).get("snapshot_id") or "").strip()


          def build_backup_retention_evidence(
              *,
              pre_deploy_health: dict[str, Any],
              post_restart_health: dict[str, Any],
              post_deploy_health: dict[str, Any],
              production_source_snapshot_sha256: str,
              backup_root_persistence_mode: str,
              external_replication_verified: bool,
              external_snapshot_locator: str,
              observed_at: str,
          ) -> dict[str, Any]:
              """Derive deployment backup-retention evidence from observed runtime health."""
              before = _backup_status(pre_deploy_health)
              restarted = _backup_status(post_restart_health)
              deployed = _backup_status(post_deploy_health)
              blockers: list[str] = []

              if not before:
                  blockers.append("PREDEPLOY_BACKUP_HEALTH_INVALID")
              if not restarted:
                  blockers.append("POST_RESTART_BACKUP_HEALTH_INVALID")
              if not deployed:
                  blockers.append("POST_DEPLOY_BACKUP_HEALTH_INVALID")

              before_id = _snapshot_id(before)
              restart_id = _snapshot_id(restarted)
              deploy_id = _snapshot_id(deployed)
              if not before_id or before.get("daily_snapshot_present") is not True:
                  blockers.append("PREEXISTING_BACKUP_SNAPSHOT_NOT_OBSERVED")
              if before_id and restart_id != before_id:
                  blockers.append("BACKUP_HISTORY_NOT_PRESERVED_AFTER_RESTART")
              if before_id and deploy_id != before_id:
                  blockers.extend(("PREDEPLOY_BACKUP_SNAPSHOT_NOT_PRESERVED", "BACKUP_HISTORY_NOT_PRESERVED_AFTER_DEPLOY"))

              before_root = str(before.get("backup_root") or "").strip()
              restart_root = str(restarted.get("backup_root") or "").strip()
              deploy_root = str(deployed.get("backup_root") or "").strip()
              if not before_root:
                  blockers.append("BACKUP_ROOT_MISSING")
              if before_root and restart_root != before_root:
                  blockers.append("BACKUP_ROOT_CHANGED_AFTER_RESTART")
              if before_root and deploy_root != before_root:
                  blockers.append("BACKUP_ROOT_CHANGED_AFTER_DEPLOY")
              if any(status and status.get("restore_overwrites_live_root") is not False for status in (before, restarted, deployed)):
                  blockers.append("BACKUP_RESTORE_MAY_OVERWRITE_LIVE_ROOT")

              mode = str(backup_root_persistence_mode or "").strip().upper()
              if mode not in _DURABLE_BACKUP_MODES:
                  blockers.append("BACKUP_ROOT_NOT_DURABLE")
              if external_replication_verified is not True:
                  blockers.append("EXTERNAL_BACKUP_REPLICATION_NOT_VERIFIED")
              locator = str(external_snapshot_locator or "").strip()
              if not locator:
                  blockers.append("EXTERNAL_BACKUP_SNAPSHOT_LOCATOR_MISSING")

              source_sha = str(production_source_snapshot_sha256 or "").strip().lower()
              if len(source_sha) != 64 or any(ch not in "0123456789abcdef" for ch in source_sha):
                  blockers.append("PRODUCTION_SOURCE_SNAPSHOT_INVALID")
              observed = str(observed_at or "").strip()
              if not observed:
                  blockers.append("OBSERVED_AT_MISSING")

              blockers = list(dict.fromkeys(blockers))
              return {
                  "schema": "cbi.v64-backup-retention-evidence.v1",
                  "verified": not blockers,
                  "production_source_snapshot_sha256": source_sha,
                  "preexisting_snapshot_observed": bool(before_id) and before.get("daily_snapshot_present") is True,
                  "snapshot_id_before_deploy": before_id or None,
                  "snapshot_id_after_restart": restart_id or None,
                  "snapshot_ids_after_deploy": [deploy_id] if deploy_id else [],
                  "backup_history_preserved_after_restart": bool(before_id) and restart_id == before_id,
                  "backup_history_preserved_after_deploy": bool(before_id) and deploy_id == before_id,
                  "backup_root_before_deploy": before_root or None,
                  "backup_root_after_restart": restart_root or None,
                  "backup_root_after_deploy": deploy_root or None,
                  "backup_root_persistence_mode": mode or None,
                  "external_replication_verified": external_replication_verified is True,
                  "external_snapshot_locator": locator or None,
                  "restore_target_isolated": True,
                  "restore_overwrites_live_root": False,
                  "observed_at": observed or None,
                  "source": "HOST_BACKUP_RETENTION_HEALTH_SEQUENCE",
                  "blockers": blockers,
              }
          PYFILE

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8')
              if new in t:
                  return
              if t.count(old)!=1:
                  raise SystemExit(f'{path}: anchor count {t.count(old)} for {old[:80]!r}')
              p.write_text(t.replace(old,new,1),encoding='utf-8')

          # Contract: add fail-closed v6.4 backup-retention release requirement.
          replace_once('unified_runtime/contract_v63.py',
              '        "runtime_durable_backend_contract_v6_3": {\n',
              '''        "deployment_backup_retention_v6_4": {\n            "required_before_production": True,\n            "evidence_schema": "cbi.v64-backup-retention-evidence.v1",\n            "preexisting_snapshot_must_survive_restart": True,\n            "preexisting_snapshot_must_survive_deploy": True,\n            "external_replication_required": True,\n            "local_ephemeral_root_sufficient": False,\n            "primary_r2_state_restore_proves_backup_retention": False,\n            "restore_target_must_be_isolated": True,\n            "restore_may_overwrite_live_root": False,\n        },\n        "runtime_durable_backend_contract_v6_3": {\n''')

          # Production gate: backup retention is an independent required gate.
          replace_once('unified_runtime/production_gate_v63.py',
              '    if not bool(payload.get("render_r2_pvc_acceptance_verified")):\n        blockers.append("V63_RENDER_R2_PVC_ACCEPTANCE_NOT_VERIFIED")\n\n',
              '    if not bool(payload.get("render_r2_pvc_acceptance_verified")):\n        blockers.append("V63_RENDER_R2_PVC_ACCEPTANCE_NOT_VERIFIED")\n    if not bool(payload.get("backup_retention_verified")):\n        blockers.append("BACKUP_RETENTION_NOT_VERIFIED")\n\n')
          replace_once('unified_runtime/production_gate_v63.py',
              '        "checked_render_r2_pvc_acceptance": bool(payload.get("render_r2_pvc_acceptance_verified")),\n',
              '        "checked_render_r2_pvc_acceptance": bool(payload.get("render_r2_pvc_acceptance_verified")),\n        "checked_backup_retention": bool(payload.get("backup_retention_verified")),\n')

          # Existing positive gate fixture now explicitly proves the new gate.
          replace_once('tests/test_v63_production_gate.py',
              '            "render_r2_pvc_acceptance_verified": True,\n',
              '            "render_r2_pvc_acceptance_verified": True,\n            "backup_retention_verified": True,\n')

          # Release evidence: preserve current combined Render/R2/PVC authority and add backup retention alongside it.
          p=Path('unified_runtime/release_evidence_v63.py'); t=p.read_text(encoding='utf-8')
          marker='\ndef evaluate_v63_release_evidence_bundle(bundle: dict[str, Any]) -> dict[str, Any]:\n'
          validator='''\ndef _validate_backup_retention_report(\n    report: dict[str, Any] | None,\n    *,\n    expected_production_source_snapshot_sha256: str,\n) -> dict[str, Any]:\n    payload = dict(report or {})\n    blockers: list[str] = []\n    if payload.get("schema") != "cbi.v64-backup-retention-evidence.v1":\n        blockers.append("BACKUP_RETENTION_EVIDENCE_SCHEMA_INVALID")\n    snapshot = str(payload.get("production_source_snapshot_sha256") or "").lower()\n    expected = str(expected_production_source_snapshot_sha256 or "").lower()\n    if snapshot != expected or len(snapshot) != 64:\n        blockers.append("PRODUCTION_SOURCE_SNAPSHOT_MISMATCH")\n    if payload.get("source") != "HOST_BACKUP_RETENTION_HEALTH_SEQUENCE":\n        blockers.append("BACKUP_RETENTION_SOURCE_INVALID")\n    if not str(payload.get("observed_at") or "").strip():\n        blockers.append("BACKUP_RETENTION_OBSERVED_AT_MISSING")\n    if payload.get("preexisting_snapshot_observed") is not True:\n        blockers.append("PREEXISTING_BACKUP_SNAPSHOT_NOT_OBSERVED")\n    before_id = str(payload.get("snapshot_id_before_deploy") or "").strip()\n    restart_id = str(payload.get("snapshot_id_after_restart") or "").strip()\n    after_ids = {str(v).strip() for v in (payload.get("snapshot_ids_after_deploy") or []) if str(v).strip()}\n    if not before_id:\n        blockers.append("PREDEPLOY_BACKUP_SNAPSHOT_ID_MISSING")\n    elif before_id not in after_ids:\n        blockers.append("PREDEPLOY_BACKUP_SNAPSHOT_NOT_PRESERVED")\n    if before_id and restart_id != before_id:\n        blockers.append("PREDEPLOY_BACKUP_SNAPSHOT_NOT_PRESERVED_AFTER_RESTART")\n    if payload.get("backup_history_preserved_after_restart") is not True:\n        blockers.append("BACKUP_HISTORY_NOT_PRESERVED_AFTER_RESTART")\n    if payload.get("backup_history_preserved_after_deploy") is not True:\n        blockers.append("BACKUP_HISTORY_NOT_PRESERVED_AFTER_DEPLOY")\n    persistence_mode = str(payload.get("backup_root_persistence_mode") or "").strip().upper()\n    durable_modes = {"OBJECT_STORE_REPLICATED", "EXTERNAL_DURABLE_ROOT", "PERSISTENT_VOLUME_WITH_EXTERNAL_REPLICA"}\n    if persistence_mode not in durable_modes:\n        blockers.append("BACKUP_ROOT_NOT_DURABLE")\n    if payload.get("external_replication_verified") is not True:\n        blockers.append("EXTERNAL_BACKUP_REPLICATION_NOT_VERIFIED")\n    if not str(payload.get("external_snapshot_locator") or "").strip():\n        blockers.append("EXTERNAL_BACKUP_SNAPSHOT_LOCATOR_MISSING")\n    if payload.get("restore_target_isolated") is not True:\n        blockers.append("BACKUP_RESTORE_TARGET_NOT_ISOLATED")\n    if payload.get("restore_overwrites_live_root") is not False:\n        blockers.append("BACKUP_RESTORE_MAY_OVERWRITE_LIVE_ROOT")\n    blockers = list(dict.fromkeys(blockers))\n    return {\n        "schema": "cbi.v64-backup-retention-validation.v1",\n        "verified": not blockers,\n        "status": "VERIFIED" if not blockers else "BLOCKED",\n        "production_source_snapshot_sha256": snapshot,\n        "snapshot_id_before_deploy": before_id or None,\n        "snapshot_id_after_restart": restart_id or None,\n        "snapshot_ids_after_deploy": sorted(after_ids),\n        "backup_root_persistence_mode": persistence_mode or None,\n        "blockers": blockers,\n    }\n\n'''
          if '_validate_backup_retention_report(' not in t:
              if t.count(marker)!=1: raise SystemExit('release validator marker mismatch')
              t=t.replace(marker,'\n'+validator+marker.lstrip('\n'),1)
          p.write_text(t,encoding='utf-8')

          replace_once('unified_runtime/release_evidence_v63.py',
              '    render_r2_pvc = _validate_render_r2_pvc_release_receipt(\n        payload.get("render_r2_pvc_acceptance_report")\n    )\n\n',
              '    render_r2_pvc = _validate_render_r2_pvc_release_receipt(\n        payload.get("render_r2_pvc_acceptance_report")\n    )\n    backup_retention = _validate_backup_retention_report(\n        payload.get("backup_retention_evidence_report"),\n        expected_production_source_snapshot_sha256=current_snapshot,\n    )\n\n')
          replace_once('unified_runtime/release_evidence_v63.py',
              '        "render_r2_pvc_acceptance_verified": bool(render_r2_pvc.get("verified")),\n',
              '        "render_r2_pvc_acceptance_verified": bool(render_r2_pvc.get("verified")),\n        "backup_retention_verified": bool(backup_retention.get("verified")),\n')
          replace_once('unified_runtime/release_evidence_v63.py',
              '            "render_r2_pvc_acceptance": render_r2_pvc,\n',
              '            "render_r2_pvc_acceptance": render_r2_pvc,\n            "backup_retention": backup_retention,\n')

          # Payload ownership: promote the CURRENT runner-owned inventory into binding_plan as shared authority.
          runner=Path('unified_runtime/production_integration_runner.py')
          rt=runner.read_text(encoding='utf-8')
          start=rt.index('V63_RUNTIME_PAYLOAD_NAMES = (')
          end=rt.index('\n\n\ndef _payload_paths()', start)
          tuple_block=rt[start:end]
          plan=Path('unified_runtime/production_binding_plan.py')
          pt=plan.read_text(encoding='utf-8')
          anchor='_EXPECTED_PREPATCH_GAPS = {"V63_MUTATION_INVENTORY_INCOMPLETE"}\n'
          if 'V63_RUNTIME_PAYLOAD_NAMES = (' not in pt:
              if pt.count(anchor)!=1: raise SystemExit('payload authority anchor mismatch')
              pt=pt.replace(anchor,anchor+'\n# Explicit v6.3-owned payload boundary; never infer ownership from directory contents.\n'+tuple_block+'\n',1)
          old='''def _runtime_payload_files() -> list[str]:\n    root = Path(__file__).resolve().parent\n    files = []\n    for path in sorted(root.glob("*.py")):\n        if path.name == "__init__.py":\n            continue\n        files.append(f"unified_runtime/{path.name}")\n    return files\n'''
          new='''def _runtime_payload_files() -> list[str]:\n    return [f"unified_runtime/{name}" for name in V63_RUNTIME_PAYLOAD_NAMES]\n'''
          if new not in pt:
              if pt.count(old)!=1: raise SystemExit('runtime payload glob anchor mismatch')
              pt=pt.replace(old,new,1)
          plan.write_text(pt,encoding='utf-8')

          # Runner imports the same authority; no duplicate ownership list.
          rt=runner.read_text(encoding='utf-8')
          if 'from .production_binding_plan import (\n    V63_RUNTIME_PAYLOAD_NAMES,' not in rt:
              rt=rt.replace('from .production_binding_plan import build_v63_production_binding_plan\n',
                  'from .production_binding_plan import (\n    V63_RUNTIME_PAYLOAD_NAMES,\n    build_v63_production_binding_plan,\n)\n',1)
          if 'V63_RUNTIME_PAYLOAD_NAMES = (' in rt:
              start=rt.index('V63_RUNTIME_PAYLOAD_NAMES = (')
              end=rt.index('\n\n\ndef _payload_paths()', start)
              rt=rt[:start]+rt[end+2:]
          runner.write_text(rt,encoding='utf-8')

          # Exact-checkout staging must execute all gate tests, including v6.4 sidecars.
          p=Path('release_ops_v63/exact_checkout_candidate_builder.py'); t=p.read_text(encoding='utf-8')
          if "'test_*.py'" not in t and '"test_*.py"' not in t:
              if "test_v63_*.py" not in t: raise SystemExit('staging test pattern anchor missing')
              t=t.replace('test_v63_*.py','test_*.py')
          p.write_text(t,encoding='utf-8')
          PY

          python -m py_compile \
            unified_runtime/backup_retention_evidence_v64.py \
            unified_runtime/contract_v63.py \
            unified_runtime/production_gate_v63.py \
            unified_runtime/release_evidence_v63.py \
            unified_runtime/production_binding_plan.py \
            unified_runtime/production_integration_runner.py \
            release_ops_v63/exact_checkout_candidate_builder.py
          git diff --check

      - name: GREEN targeted semantic tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests/test_v64_stream_b_semantic_forward_port.py
          python -m unittest -q tests/test_v63_production_gate.py
          python -m unittest -q tests/test_v63_production_binding_plan.py
          python -m unittest -q tests/test_v63_production_integration_runner.py
          python -m unittest -q tests/test_v63_exact_checkout_candidate_builder.py

      - name: GREEN full repository suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Persist GREEN and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            unified_runtime/backup_retention_evidence_v64.py \
            unified_runtime/contract_v63.py \
            unified_runtime/production_gate_v63.py \
            unified_runtime/release_evidence_v63.py \
            unified_runtime/production_binding_plan.py \
            unified_runtime/production_integration_runner.py \
            release_ops_v63/exact_checkout_candidate_builder.py \
            tests/test_v63_production_gate.py \
            tests/test_v64_stream_b_semantic_forward_port.py
          git commit -m 'fix(v64): semantic forward-port backup retention and payload ownership'
          git rm -f .github/workflows/cbi-v64-stream-b-red.yml .github/workflows/cbi-v64-stream-b-green.yml .cbi-v64-stream-b/RED_READY .cbi-v64-stream-b/GREEN_READY
          if test -f .github/workflows/cbi-v64-stream-a-bootstrap.yml; then git rm -f .github/workflows/cbi-v64-stream-a-bootstrap.yml; fi
          git commit -m 'chore(v64): remove semantic forward-port bootstrap workflows'
          git diff --check 58e14973c62cca5a9daefa7b4012e427135736d5..HEAD
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/cbi-v6-3-demand-expansion | awk '{print $1}')" = '58e14973c62cca5a9daefa7b4012e427135736d5'
          test "$(git ls-remote origin refs/heads/cbi-v6-cloud-runtime-20260901 | awk '{print $1}')" = 'a311a2a57ee43a1f1a3b2819bf28946566b05692'
          git push origin HEAD:refs/heads/cbi-v64-semantic-forward-port-58e14973
