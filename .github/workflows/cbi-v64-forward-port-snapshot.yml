name: CBI v6.4 one-shot snapshot forward-port

on:
  push:
    branches:
      - cbi-v64-backup-wal-hardening-20260909

permissions:
  contents: write

jobs:
  forward-port:
    if: github.event.head_commit.message == 'ci(v64): stage snapshot forward-port runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install timezone data
        run: python -m pip install --disable-pip-version-check --no-input tzdata==2026.3
      - name: Configure git
        run: |
          git config user.name 'cbi-v64-forward-port'
          git config user.email 'actions@users.noreply.github.com'
      - name: Cherry-pick verified snapshot implementation
        run: |
          git fetch origin 50476af5a695f0eb508ffaac626f5b282681585c
          git cherry-pick -x 50476af5a695f0eb508ffaac626f5b282681585c
      - name: Verify GREEN before push
        run: |
          python -m unittest \
            tests.test_v64_request_scoped_verified_snapshot \
            tests.test_v64_route_promotion_safety \
            tests.test_v61_research_orchestration_hardening -v
      - name: Remove one-shot runner
        run: |
          git rm .github/workflows/cbi-v64-forward-port-snapshot.yml
          git commit -m 'chore(v64): remove snapshot forward-port runner'
      - name: Push verified result
        run: git push origin HEAD:cbi-v64-backup-wal-hardening-20260909
