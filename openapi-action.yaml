openapi: 3.1.0
info:
  title: Customs Buyer Intelligence Ledger
  description: Persistent, auditable buyer evidence ledger and deterministic outreach firewall.
  version: 2.1.0
servers:
- url: https://YOUR-SERVICE.onrender.com
paths:
  /health:
    get:
      summary: Health
      description: Check whether the backend is awake. This does not inspect or modify buyer data.
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Gethealth
      x-openai-isConsequential: false
  /ledger/lookup:
    post:
      summary: Lookup Buyer Ledger
      description: Load prior buyer, shipment, evidence, contact, and event data before starting a new investigation.
      operationId: lookupBuyerLedger
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerLookupRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Lookupbuyerledger
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      x-openai-isConsequential: false
  /ledger/merge:
    post:
      summary: Merge Buyer Ledger
      description: Append and deduplicate source-bound evidence, shipment records, and contacts after current research.
      operationId: mergeBuyerLedger
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerMergeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Mergebuyerledger
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      x-openai-isConsequential: true
  /outreach/events:
    post:
      summary: Record Outreach Event
      description: Record a sent, bounce, reply, CRM, or rating event only from user confirmation, an upload, or a connector
        receipt.
      operationId: recordOutreachEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutreachEvent'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Recordoutreachevent
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      x-openai-isConsequential: true
  /outreach/validate:
    post:
      summary: Validate Outreach Draft
      description: Apply the deterministic recipient-union and safety firewall before presenting a mailto draft link.
      operationId: validateOutreachDraft
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutreachValidationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Validateoutreachdraft
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      x-openai-isConsequential: false
components:
  schemas:
    BuyerIdentity:
      properties:
        legal_name:
          type: string
          maxLength: 300
          minLength: 1
          title: Legal Name
        customs_name:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Customs Name
        country:
          type: string
          maxLength: 120
          minLength: 1
          title: Country
        address:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Address
        aliases:
          items:
            type: string
          type: array
          maxItems: 50
          title: Aliases
        business_type:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Business Type
        source_ids:
          items:
            type: string
          type: array
          title: Source Ids
      additionalProperties: false
      type: object
      required:
      - legal_name
      - country
      title: BuyerIdentity
    ContactRecord:
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 3
          title: Email
        person_name:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Person Name
        title_as_sourced:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Title As Sourced
        entity:
          type: string
          maxLength: 300
          minLength: 1
          title: Entity
        first_seen:
          anyOf:
          - type: string
          - type: 'null'
          title: First Seen
        last_checked:
          type: string
          title: Last Checked
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        employment_status:
          type: string
          enum:
          - current
          - historical
          - unknown
          - not_applicable
          title: Employment Status
          default: unknown
        procurement_authority_status:
          type: string
          enum:
          - confirmed
          - unverified
          - not_procurement
          title: Procurement Authority Status
          default: unverified
        route_class:
          $ref: '#/components/schemas/RouteClass'
        risk_note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Risk Note
        recommended_use:
          type: string
          maxLength: 1000
          minLength: 1
          title: Recommended Use
        source_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Source Ids
        privacy_class:
          type: string
          enum:
          - public_business
          - private_or_sensitive
          title: Privacy Class
          default: public_business
      additionalProperties: false
      type: object
      required:
      - email
      - entity
      - verification_status
      - route_class
      - recommended_use
      - source_ids
      title: ContactRecord
    EvidenceRecord:
      properties:
        evidence_id:
          type: string
          maxLength: 120
          minLength: 1
          title: Evidence Id
        claim:
          type: string
          maxLength: 2000
          minLength: 1
          title: Claim
        claim_class:
          type: string
          enum:
          - FACT
          - INFERENCE
          - HYPOTHESIS
          - RECOMMENDATION
          - UNKNOWN
          title: Claim Class
        source_type:
          $ref: '#/components/schemas/SourceType'
        source_reference:
          type: string
          maxLength: 2000
          minLength: 1
          title: Source Reference
        source_url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Source Url
        source_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Date
        checked_at:
          type: string
          title: Checked At
        evidence_grade:
          type: string
          enum:
          - A1
          - A2
          - B1
          - B2
          - C1
          - C2
          - D
          title: Evidence Grade
        boundary:
          type: string
          maxLength: 2000
          minLength: 1
          title: Boundary
        conflict:
          anyOf:
          - type: string
          - type: 'null'
          title: Conflict
      additionalProperties: false
      type: object
      required:
      - evidence_id
      - claim
      - claim_class
      - source_type
      - source_reference
      - evidence_grade
      - boundary
      title: EvidenceRecord
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LedgerLookupRequest:
      properties:
        legal_or_customs_name:
          type: string
          maxLength: 300
          minLength: 1
          title: Legal Or Customs Name
        country:
          type: string
          maxLength: 120
          minLength: 1
          title: Country
        aliases:
          items:
            type: string
          type: array
          maxItems: 50
          title: Aliases
      additionalProperties: false
      type: object
      required:
      - legal_or_customs_name
      - country
      title: LedgerLookupRequest
    LedgerMergeRequest:
      properties:
        buyer:
          $ref: '#/components/schemas/BuyerIdentity'
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceRecord'
          type: array
          maxItems: 500
          title: Evidence
        trade_records:
          items:
            $ref: '#/components/schemas/TradeRecord'
          type: array
          maxItems: 1000
          title: Trade Records
        contacts:
          items:
            $ref: '#/components/schemas/ContactRecord'
          type: array
          maxItems: 1000
          title: Contacts
        run_manifest:
          $ref: '#/components/schemas/RunManifest'
      additionalProperties: false
      type: object
      required:
      - buyer
      - run_manifest
      title: LedgerMergeRequest
    OutreachEvent:
      properties:
        buyer_key:
          type: string
          maxLength: 200
          minLength: 1
          title: Buyer Key
        event_type:
          type: string
          enum:
          - sent
          - bounced
          - replied
          - crm_created
          - rating_changed
          title: Event Type
        target:
          type: string
          maxLength: 500
          minLength: 1
          title: Target
        event_time:
          type: string
          title: Event Time
        source_type:
          type: string
          enum:
          - user_confirmed
          - uploaded_record
          - connector_receipt
          title: Source Type
        source_reference:
          type: string
          maxLength: 2000
          minLength: 1
          title: Source Reference
        details:
          additionalProperties: true
          type: object
          title: Details
      additionalProperties: false
      type: object
      required:
      - buyer_key
      - event_type
      - target
      - event_time
      - source_type
      - source_reference
      title: OutreachEvent
    OutreachValidationRequest:
      properties:
        outreach_recommended:
          type: boolean
          title: Outreach Recommended
          default: true
        recipient:
          type: string
          title: Recipient
          default: ''
        recipient_status:
          $ref: '#/components/schemas/VerificationStatus'
          default: missing
        subject:
          type: string
          maxLength: 160
          title: Subject
          default: ''
        body:
          type: string
          maxLength: 10000
          title: Body
          default: ''
        chinese_translation:
          type: string
          maxLength: 10000
          title: Chinese Translation
          default: ''
        firewall_passed:
          type: boolean
          title: Firewall Passed
          default: false
        human_style_passed:
          type: boolean
          title: Human Style Passed
          default: false
        discovered_email_count:
          type: integer
          minimum: 0.0
          title: Discovered Email Count
        recipient_routes:
          items:
            $ref: '#/components/schemas/RecipientRoute'
          type: array
          maxItems: 1000
          title: Recipient Routes
        time_plan:
          additionalProperties: true
          type: object
          title: Time Plan
        block_reasons:
          items:
            type: string
          type: array
          title: Block Reasons
      additionalProperties: false
      type: object
      required:
      - discovered_email_count
      title: OutreachValidationRequest
    RecipientRoute:
      properties:
        recipient:
          type: string
          maxLength: 320
          minLength: 3
          title: Recipient
        recipient_status:
          $ref: '#/components/schemas/VerificationStatus'
        route_class:
          $ref: '#/components/schemas/RouteClass'
        role:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Role
        source_reference:
          type: string
          maxLength: 2000
          minLength: 1
          title: Source Reference
      additionalProperties: false
      type: object
      required:
      - recipient
      - recipient_status
      - route_class
      - source_reference
      title: RecipientRoute
    RouteClass:
      type: string
      enum:
      - DIRECT_PROCUREMENT
      - FORMAL_GENERAL
      - ALTERNATIVE_REFERRAL
      - VERIFY_ONLY
      - DO_NOT_USE
      title: RouteClass
    RunManifest:
      properties:
        run_id:
          type: string
          maxLength: 200
          minLength: 1
          title: Run Id
        input_hash:
          type: string
          maxLength: 200
          minLength: 8
          title: Input Hash
        investigated_at:
          type: string
          title: Investigated At
        prior_ledger_name:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Prior Ledger Name
        prior_ledger_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Prior Ledger Date
        declared_previous_trade_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Declared Previous Trade Count
        declared_previous_email_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Declared Previous Email Count
      additionalProperties: false
      type: object
      required:
      - run_id
      - input_hash
      title: RunManifest
    SourceType:
      type: string
      enum:
      - government_registry
      - official_domain
      - official_social
      - court_or_regulator
      - trade_database
      - professional_source
      - third_party_directory
      - user_input
      - uploaded_record
      - connector_receipt
      title: SourceType
    TradeRecord:
      properties:
        record_id:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Record Id
        date:
          type: string
          maxLength: 50
          minLength: 1
          title: Date
        master_bill:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Master Bill
        house_bill:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: House Bill
        declaration_number:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Declaration Number
        item_number:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Item Number
        buyer:
          type: string
          maxLength: 300
          minLength: 1
          title: Buyer
        supplier_or_exporter:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Supplier Or Exporter
        product_raw:
          type: string
          maxLength: 3000
          minLength: 1
          title: Product Raw
        normalized_product:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Normalized Product
        quantity:
          anyOf:
          - type: number
          - type: 'null'
          title: Quantity
        uom:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Uom
        weight_kg:
          anyOf:
          - type: number
          - type: 'null'
          title: Weight Kg
        provider:
          type: string
          maxLength: 200
          minLength: 1
          title: Provider
        data_level:
          type: string
          enum:
          - shipment
          - bill
          - declaration
          - item
          - unknown
          title: Data Level
          default: unknown
        date_semantics:
          type: string
          maxLength: 300
          minLength: 1
          title: Date Semantics
        source_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Source Ids
      additionalProperties: false
      type: object
      required:
      - date
      - buyer
      - product_raw
      - provider
      - date_semantics
      - source_ids
      title: TradeRecord
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerificationStatus:
      type: string
      enum:
      - official_current
      - user_confirmed_current
      - directory_current
      - historical
      - inferred
      - bounced_specific_address
      - missing
      title: VerificationStatus
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-Action-Key
