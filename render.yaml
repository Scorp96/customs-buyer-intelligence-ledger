services:
  - type: web
    name: cbi-v61-preview
    runtime: docker
    repo: https://github.com/Scorp96/customs-buyer-intelligence-ledger
    branch: cbi-v6-cloud-runtime-20260901
    region: singapore
    plan: free
    dockerfilePath: ./deploy/cloud/Dockerfile
    dockerContext: .
    dockerCommand: python -B -Xutf8 mcp/render_bootstrap.py
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    renderSubdomainPolicy: enabled
    envVars:
      - key: CBI_RENDER_LIVE_ROOT
        value: /var/lib/cbi/live
      - key: CBI_SESSION_ROOT
        value: /var/lib/cbi/live/sessions
      - key: CBI_BACKUP_ROOT
        value: /var/lib/cbi/live/backups-v61
      - key: CBI_REMOTE_HOST
        value: 0.0.0.0
      - key: CBI_REMOTE_PUBLIC_BASE_URL
        value: https://cbi-v61-preview.onrender.com
      - key: CBI_REMOTE_AUTH_MODE
        value: bearer
      - key: CBI_REMOTE_BEARER_TOKEN
        sync: false
      - key: CBI_REMOTE_GITHUB_ALLOWED_LOGINS
        value: Scorp96
      # This Blueprint uses Render's ephemeral Free web service.
      # Never start a writable production Runtime without R2/S3 recovery.
      - key: CBI_REQUIRE_EPHEMERAL_DURABILITY
        value: "1"
      - key: CBI_OBJECT_STORE_MODE
        value: r2
      # Secrets and resource names are supplied through the Render Dashboard,
      # NEVER committed. For existing Blueprints, sync:false additions must
      # be set manually; Render only prompts at initial Blueprint creation.
      - key: CBI_OBJECT_STORE_ENDPOINT
        sync: false
      - key: CBI_OBJECT_STORE_BUCKET
        sync: false
      - key: CBI_OBJECT_STORE_ACCESS_KEY_ID
        sync: false
      - key: CBI_OBJECT_STORE_SECRET_ACCESS_KEY
        sync: false
      - key: CBI_REMOTE_MAX_BODY_BYTES
        value: "8388608"
      - key: CBI_CRAWLER_ENABLED
        value: "1"
