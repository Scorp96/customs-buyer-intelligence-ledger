services:
  - type: web
    name: customs-buyer-intelligence-ledger
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: STORE_MODE
        value: github
      - key: GITHUB_LEDGER_BRANCH
        value: ledger-data
      - key: GITHUB_LEDGER_PATH
        value: data/customs-buyer-ledger.json
      - key: GITHUB_REPOSITORY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ACTION_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
